name: Focused AI timeout comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - timeout: '180000'
            delay: '60000'
          - timeout: '80000'
            delay: '5000'
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    env:
      MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
      MIDSCENE_MODEL_BASE_URL: ${{ vars.MIDSCENE_MODEL_BASE_URL }}
      MIDSCENE_MODEL_NAME: ${{ vars.MIDSCENE_MODEL_NAME }}
      MIDSCENE_MODEL_FAMILY: ${{ vars.MIDSCENE_MODEL_FAMILY }}
      MIDSCENE_MODEL_RETRY_COUNT: "2"
      # Leave time for another model call within the 120-180s test deadlines.
      MIDSCENE_MODEL_TIMEOUT: ${{ matrix.timeout }}
      MIDSCENE_MODEL_RETRY_INTERVAL: ${{ matrix.delay }}
      MIDSCENE_REPORT_QUIET: "true"
      # DEBUG: midscene:* # Disabled to prevent log overflow
      CI: 1

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        ref: 54dab359ec1c4c129d32ac7e0c016ced2669ed62

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-node-pnpm

    - name: Cache pnpm store
      id: pnpm-cache
      uses: ./.github/actions/pnpm-cache/restore

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Save pnpm store
      if: steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/pnpm-cache/save

    - name: Setup Puppeteer browser
      uses: ./.github/actions/setup-puppeteer-browser

    - name: Build AI unit test projects
      run: pnpm exec nx run-many --target=build --projects="@midscene/report,@midscene/core,@midscene/web,@midscene/cli"
    

    - name: Run matched cases twice with the original test-level retry
      uses: ./.github/actions/ai-ci
      with:
        command: |
          failures=0
          for round in 1 2; do
            echo "::group::Round $round"
            AITEST=true pnpm --dir packages/core exec rstest run tests/ai/llm-planning/basic.test.ts -t 'todo mvc - check second todo item' &
            core_pid=$!
            AI_TEST_TYPE=web pnpm --dir packages/web-integration exec rstest run tests/ai/web/puppeteer/file-upload.test.ts tests/ai/web/puppeteer/report-merging.test.ts -t 'should upload files via aiAct|search weather on search engine' &
            web_pid=$!
            wait "$core_pid" || failures=1
            wait "$web_pid" || failures=1
            echo "::endgroup::"
          done
          exit "$failures"
