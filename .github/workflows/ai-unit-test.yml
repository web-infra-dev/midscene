name: PR 3225 model transport diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      MODEL_BASE_URL: ${{ vars.MIDSCENE_MODEL_BASE_URL }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.0'
      - name: Compare unauthenticated transport requests
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/network-probe.mjs" <<'NODE'
          import net from 'node:net';
          import dns from 'node:dns/promises';
          const target = new URL(process.env.MODEL_BASE_URL);
          target.pathname = target.pathname.replace(/\/$/, '') + '/models';
          console.log('node',process.version,'host',target.hostname,'attemptTimeout',net.getDefaultAutoSelectFamilyAttemptTimeout());
          console.log('dns',await dns.lookup(target.hostname,{all:true}));
          for(const mode of ['default','longer-attempt','single-family']) {
           if(mode==='longer-attempt')net.setDefaultAutoSelectFamilyAttemptTimeout(3000);
           if(mode==='single-family')net.setDefaultAutoSelectFamily(false);
           for(let trial=1;trial<=3;trial++) {
            const start=Date.now();
            try { const r=await fetch(target,{signal:AbortSignal.timeout(15000)}); console.log(JSON.stringify({mode,trial,status:r.status,ms:Date.now()-start}));await r.body?.cancel(); }
            catch(e){ console.log(JSON.stringify({mode,trial,ms:Date.now()-start,error:e.message,cause:e.cause?.code,attempts:e.cause?.errors?.map(x=>({code:x.code,address:x.address,port:x.port}))})); }
           }
          }
          NODE
          node "$RUNNER_TEMP/network-probe.mjs"
  configured-linux:
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
