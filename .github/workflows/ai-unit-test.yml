name: Compare fresh Ark connections on Linux
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-connections:
    strategy:
      matrix:
        replica: [1, 2]
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    timeout-minutes: 12
    env:
      MODEL_URL: ${{ vars.MIDSCENE_MODEL_BASE_URL }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.0'
      - name: Compare address attempt budgets and IPv4 on fresh connections
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import https from 'node:https';
          const url = new URL(process.env.MODEL_URL.replace(/\/$/, '') + '/models');
          const settings = [
            ['current-2s', {autoSelectFamily: true, autoSelectFamilyAttemptTimeout: 2000}],
            ['longer-8s', {autoSelectFamily: true, autoSelectFamilyAttemptTimeout: 8000}],
            ['ipv4', {family: 4}],
          ];
          async function trial(round, label, options) {
            const start = performance.now();
            const data = {round, label};
            const elapsed = () => Math.round(performance.now() - start);
            await new Promise(resolve => {
              const req = https.get(url, {...options, agent: false, signal: AbortSignal.timeout(12000)}, res => {
                data.status = res.statusCode;
                data.headersMs = elapsed();
                res.resume();
                res.on('end', resolve);
              });
              req.on('socket', socket => {
                socket.once('connect', () => {data.tcpMs = elapsed(); data.ip = socket.remoteAddress;});
                socket.once('secureConnect', () => {data.tlsMs = elapsed();});
                socket.on('connectionAttemptTimeout', address => {(data.addressTimeouts ??= []).push(address);});
              });
              req.once('error', e => {data.error = e.code; data.ms = elapsed(); resolve();});
            });
            console.log(JSON.stringify(data));
          }
          for (let round = 0; round < 18; round++) {
            for (let i = 0; i < settings.length; i++) await trial(round, ...settings[(round + i) % settings.length]);
          }
          NODE
