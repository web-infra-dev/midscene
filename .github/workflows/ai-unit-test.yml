name: AI unit test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  ai-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    env:
      MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
      MIDSCENE_MODEL_BASE_URL: ${{ vars.MIDSCENE_MODEL_BASE_URL }}
      MIDSCENE_MODEL_NAME: ${{ vars.MIDSCENE_MODEL_NAME }}
      MIDSCENE_MODEL_FAMILY: ${{ vars.MIDSCENE_MODEL_FAMILY }}
      MIDSCENE_MODEL_RETRY_COUNT: "2"
      # Leave time for another model call within the 120-180s test deadlines.
      MIDSCENE_MODEL_TIMEOUT: "80000"
      MIDSCENE_MODEL_RETRY_INTERVAL: "5000"
      MIDSCENE_REPORT_QUIET: "true"
      # DEBUG: midscene:* # Disabled to prevent log overflow
      CI: 1

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-node-pnpm

    - name: Cache pnpm store
      id: pnpm-cache
      uses: ./.github/actions/pnpm-cache/restore

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Save pnpm store
      if: steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/pnpm-cache/save

    - name: Setup Puppeteer browser
      uses: ./.github/actions/setup-puppeteer-browser

    - name: Build AI unit test projects
      run: pnpm exec nx run-many --target=build --projects="@midscene/report,@midscene/core,@midscene/web,@midscene/cli"
    

    - name: Instrument the first model request in the Todo test
      shell: bash
      run: |
        file=packages/core/tests/ai/llm-planning/basic.test.ts
        sed -i '1i import "./request-observation";' "$file"
        cat > packages/core/tests/ai/llm-planning/request-observation.ts <<'TS'
        const origin = new URL(process.env.MIDSCENE_MODEL_BASE_URL!).origin;
        const send = globalThis.fetch.bind(globalThis);
        const start = Date.now();
        let sequence = 0;
        globalThis.fetch = async (input, init) => {
          const url = new URL(input instanceof Request ? input.url : String(input));
          if (url.origin !== origin) return send(input, init);
          const n = ++sequence;
          console.log('PROBE begin', n, Date.now() - start);
          if (n === 1 && process.env.STALL_FIRST === 'yes') {
            const signal = init?.signal ?? (input instanceof Request && input.signal);
            if (!signal) throw new Error('Missing SDK request signal');
            return new Promise<Response>((_, reject) => {
              const abort = () => reject(signal.reason);
              if (signal.aborted) abort();
              else signal.addEventListener('abort', abort, { once: true });
            });
          }
          const result = await send(input, init);
          console.log('PROBE ark', n, result.status, Date.now() - start);
          return result;
        };
        TS
    - name: Verify first-execution recovery and normal controls
      uses: ./.github/actions/ai-ci
      with:
        command: |
          set -euo pipefail
          for scenario in normal-old normal-final stalled-old stalled-final; do
            case "$scenario" in
              *-old) export MIDSCENE_MODEL_TIMEOUT=180000 MIDSCENE_MODEL_RETRY_INTERVAL=60000 ;;
              *-final) export MIDSCENE_MODEL_TIMEOUT=80000 MIDSCENE_MODEL_RETRY_INTERVAL=5000 ;;
            esac
            case "$scenario" in
              stalled-*) export STALL_FIRST=yes ;;
              normal-*) export STALL_FIRST=no ;;
            esac
            echo "::group::$scenario"
            log="$RUNNER_TEMP/$scenario.log"
            code=0
            AITEST=true pnpm --dir packages/core exec rstest run --retry 0 --reporter verbose tests/ai/llm-planning/basic.test.ts -t 'todo mvc - check second todo item' >"$log" 2>&1 || code=$?
            cat "$log"
            echo "::endgroup::"
            if [[ "$scenario" == stalled-old ]]; then
              [[ "$code" != 0 ]]
              grep -q 'test timed out in 180000ms' "$log"
              grep -q 'PROBE begin 1 ' "$log"
              if grep -q 'PROBE begin 2 ' "$log"; then exit 1; fi
            else
              [[ "$code" == 0 ]]
              grep -q 'todo mvc - check second todo item' "$log"
              if [[ "$scenario" == stalled-final ]]; then
                grep -q 'PROBE ark 2 200 ' "$log"
              else
                grep -q 'PROBE ark 1 200 ' "$log"
              fi
            fi
          done
