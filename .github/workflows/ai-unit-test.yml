name: AI unit test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  ai-tests:
    strategy:
      fail-fast: false
      matrix:
        order: [normal-first, padded-first]
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    env:
      MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
      MIDSCENE_MODEL_BASE_URL: ${{ vars.MIDSCENE_MODEL_BASE_URL }}
      MIDSCENE_MODEL_NAME: ${{ vars.MIDSCENE_MODEL_NAME }}
      MIDSCENE_MODEL_FAMILY: ${{ vars.MIDSCENE_MODEL_FAMILY }}
      MIDSCENE_MODEL_RETRY_COUNT: "0"
      # Leave time for another model call within the 120-180s test deadlines.
      MIDSCENE_MODEL_TIMEOUT: "400000"
      MIDSCENE_MODEL_RETRY_INTERVAL: "5000"
      MIDSCENE_REPORT_QUIET: "true"
      # DEBUG: midscene:* # Disabled to prevent log overflow
      CI: 1

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-node-pnpm

    - name: Cache pnpm store
      id: pnpm-cache
      uses: ./.github/actions/pnpm-cache/restore

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Save pnpm store
      if: steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/pnpm-cache/save

    - name: Setup Puppeteer browser
      uses: ./.github/actions/setup-puppeteer-browser

    - name: Build AI unit test projects
      run: pnpm exec nx run-many --target=build --projects="@midscene/report,@midscene/core,@midscene/web,@midscene/cli"
    

    - name: Measure end-to-end request stages without changing image pixels
      shell: bash
      run: |
        cat > packages/core/tests/ai/service/request-timing.ts <<'TS'
        import { channel } from 'node:diagnostics_channel';
        const origin = new URL(process.env.MIDSCENE_MODEL_BASE_URL!).origin;
        const send = globalThis.fetch.bind(globalThis);
        let count = 0, fullSize = 0;
        let active: Record<string, unknown> | undefined;
        let start = 0;
        for (const [name, key] of [['sendHeaders','sendHeadersMs'],['bodySent','bodySentMs'],['headers','responseHeadersMs']]) {
          const topic = name === 'sendHeaders' ? 'undici:client:' + name : 'undici:request:' + name;
          channel(topic).subscribe((event: any) => {
            if (active && String(event.request?.origin) === origin) active[key] = Date.now()-start;
          });
        }
        globalThis.fetch = async (input, init) => {
          const url = new URL(input instanceof Request ? input.url : String(input));
          if (url.origin !== origin || typeof init?.body !== 'string') return send(input,init);
          const body = init.body;
          const stage = ++count % 2 === 1 ? 'full' : 'crop';
          if (stage === 'full') fullSize = Buffer.byteLength(body);
          const labels = stage === 'full' ? ['original'] :
            process.env.PAIR_ORDER === 'normal-first' ? ['original','padded'] : ['padded','original'];
          let actual: Response | undefined;
          for (const label of labels) {
            const padding = label === 'padded' ? Math.max(0, fullSize-Buffer.byteLength(body)) : 0;
            const payload = body + ' '.repeat(padding);
            const imageBytes = [...body.matchAll(/data:image[^"]+?;base64,([A-Za-z0-9+/=]+)/g)].map(m=>Buffer.byteLength(m[1], 'base64'));
            active = {order:process.env.PAIR_ORDER,seq:count,stage,label,imageBytes,bytes:Buffer.byteLength(payload),padding};
            start = Date.now();
            try {
              const res = await send(input, {...init,body:payload});
              const data = await res.arrayBuffer();
              const result = JSON.parse(new TextDecoder().decode(data));
              Object.assign(active,{status:res.status,doneMs:Date.now()-start,usage:result.usage,requestId:res.headers.get('x-request-id')});
              if (label==='original') actual = new Response(data,{status:res.status,headers:res.headers});
            } finally { console.log('ARK_TIMING',JSON.stringify(active)); active=undefined; }
          }
          if (!actual) throw new Error('Missing original response');
          return actual;
        };
        TS
        sed -i '1i import "./request-timing";' packages/core/tests/ai/service/service.test.ts

    - name: Profile both deep locate cases
      uses: ./.github/actions/ai-ci
      env:
        PAIR_ORDER: ${{ matrix.order }}
      with:
        command: AITEST=true pnpm --dir packages/core exec rstest run --retry 0 --reporter verbose tests/ai/service/service.test.ts -t 'service locate with deep think'
