name: Site redirects

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/cloudflare/**'
      - 'apps/site/tests/cloudflare-redirects.test.ts'
      - '.github/workflows/site-redirects.yml'
  pull_request:
    paths:
      - 'apps/site/cloudflare/**'
      - 'apps/site/tests/cloudflare-redirects.test.ts'
      - '.github/workflows/site-redirects.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-redirects-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec nx test doc

  deploy:
    needs: validate
    if: github.repository == 'web-infra-dev/midscene' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Apply and read back Cloudflare redirect rules
        run: node apps/site/cloudflare/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
