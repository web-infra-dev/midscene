name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
      
permissions:
  contents: read

jobs:
  main:
    runs-on: ${{ fromJSON(vars.CI_LINUX_MINI_RUNNER || '"ubuntu-latest"') }}
    strategy:
      matrix:
        node-version: [24.13.0]

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-node-pnpm

    - name: Cache pnpm store
      id: pnpm-cache
      uses: ./.github/actions/pnpm-cache/restore

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Save pnpm store
      if: steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/pnpm-cache/save

    - name: Check AI CI entry coverage
      run: |
        node <<'NODE'
        const assert = require('node:assert/strict');
        const fs = require('node:fs');
        const { createRequire } = require('node:module');
        // Nx explicitly depends on yaml; do not rely on transitive hoisting.
        const { parse } = createRequire(require.resolve('nx/package.json'))('yaml');
        const entry = './.github/actions/ai-ci';
        // Avoid GitHub evaluating the reference as an expression in this script.
        const outputReference = id => '$' + '{{ steps.' + id + '.outputs.node-options }}';
        const hasModel = env => ['MIDSCENE_MODEL_BASE_URL', 'MIDSCENE_MODEL_API_KEY', 'OPENAI_API_KEY', 'ARK_API_KEY'].some(key => env?.[key]);

        function check(workflow) {
          const errors = [];
          for (const [name, job] of Object.entries(workflow.jobs || {})) {
            const steps = job.steps || [];
            const env = { ...workflow.env, ...job.env };
            if (!hasModel(env) && !steps.some(step => hasModel(step.env))) continue;
            const fail = message => errors.push(`${name}: ${message}`);
            const entries = steps.filter(step => step.uses === entry);
            if (!entries.length) fail('model job must use the shared AI CI entry');
            const paths = workflow.on?.pull_request?.paths;
            if (paths && !paths.includes('.github/actions/ai-ci/**')) fail('path filters must include the AI CI action');
            for (const values of [workflow.env, job.env, ...steps.map(step => step.env)]) {
              if (/network-family-autoselection/.test(values?.NODE_OPTIONS || '')) fail('connection policy must only be defined in the AI CI action');
            }
            for (const [index, step] of steps.entries()) {
              const command = step.run || step.with?.script || step.with?.command || '';
              const isTest = /^Run\b.*\b(test|tests|smoke|e2e)\b/i.test(step.name || '') || /\b(?:pnpm|npx|nx)\b[^\n]*\b(?:test(?::[\w-]+)*|e2e(?::[\w-]+)*)\b/.test(command);
              if (step.uses === entry) {
                if (step.with?.shell && !['bash', 'pwsh'].includes(step.with.shell)) fail('AI CI shell must be bash or pwsh');
                if (/\bNODE_OPTIONS\b|--network-family-autoselection/.test(command)) fail('test commands must not override the shared Node options');
                if (!command && !steps.some(next => next.env?.NODE_OPTIONS === outputReference(step.id))) fail('prepare-only AI CI output must be consumed');
                continue;
              }
              if (!isTest) continue;
              // External actions (Android emulator) cannot be run as a shell
              // command. Require the output from an earlier entry.
              const match = step.env?.NODE_OPTIONS?.match(/^\$\{\{\s*steps\.([\w-]+)\.outputs\.node-options\s*\}\}$/);
              const prepared = match && steps.slice(0, index).find(previous => previous.id === match[1] && previous.uses === entry && !previous.if && !previous['continue-on-error']);
              if (!step.uses || !prepared) fail(`${step.name || index}: model test bypasses the shared AI CI entry`);
            }
          }
          return errors;
        }

        const errors = [];
        for (const file of fs.readdirSync('.github/workflows').filter(file => /\.ya?ml$/.test(file))) {
          const workflow = parse(fs.readFileSync(`.github/workflows/${file}`, 'utf8'), { uniqueKeys: true });
          errors.push(...check(workflow).map(error => `${file}/${error}`));
        }
        assert.equal(errors.length, 0, errors.join('\n'));
        console.log('All model CI jobs use the shared AI CI entry.');
        NODE

    - name: Check Dependency Version
      run: pnpm run check-dependency-version

    - name: Biome lint
      run: npx biome check . --diagnostic-level=warn --no-errors-on-unmatched
