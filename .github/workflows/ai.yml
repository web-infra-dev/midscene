name: AI - Playwright e2e
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
  MIDSCENE_MODEL_BASE_URL: ${{ vars.MIDSCENE_MODEL_BASE_URL }}
  MIDSCENE_MODEL_NAME: ${{ vars.MIDSCENE_MODEL_NAME }}
  MIDSCENE_MODEL_FAMILY: ${{ vars.MIDSCENE_MODEL_FAMILY }}
  MIDSCENE_MODEL_RETRY_COUNT: "2"
  MIDSCENE_MODEL_RETRY_INTERVAL: "60000"
  MIDSCENE_REPORT_QUIET: "true"
  # Avoid intermittent Nx plugin worker IPC startup failures on self-hosted runners.
  NX_ISOLATE_PLUGINS: "false"
  CI: 1

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  e2e-web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-node-pnpm

    - name: Cache pnpm store
      id: pnpm-cache
      uses: ./.github/actions/pnpm-cache/restore

    - name: Cache Playwright dependencies
      uses: ./.github/actions/cache/restore
      id: cache-playwright
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Save pnpm store
      if: steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/pnpm-cache/save

    - name: Setup headless browser
      uses: ./.github/actions/setup-headless-browser

    - name: Install Playwright Chromium
      run: pnpm --dir packages/web-integration exec playwright install chromium

    - name: Save Playwright dependencies
      if: steps.cache-playwright.outputs.cache-hit != 'true'
      uses: ./.github/actions/cache/save
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Build web e2e projects
      run: pnpm exec nx run-many --target=build --projects="@midscene/report,@midscene/web,@midscene/cli,@midscene/test"

    - name: Create, install, and run the Web starter
      id: e2e-created-web
      continue-on-error: true
      timeout-minutes: 20
      uses: ./.github/actions/ai-ci
      env:
        MIDSCENE_CREATE_E2E_ARTIFACT_DIR: ${{ runner.temp }}/midscene-create-web-artifacts
      with:
        shell: bash
        command: pnpm --filter @midscene/test run e2e:create:web

    - name: Upload generated Web starter reports and logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: e2e-created-web
        path: ${{ runner.temp }}/midscene-create-web-artifacts
        include-hidden-files: true
        if-no-files-found: ignore

    # Cache behavior uses explicit fixture configuration in the standard suite.
    # MIDSCENE_CACHE does not override those options, so a second full run is redundant.
    - name: Run e2e tests
      uses: ./.github/actions/ai-ci
      with:
        command: pnpm run e2e
      id: e2e-tests
      continue-on-error: true

    - name: Upload e2e report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: e2e-report
        path: ${{ github.workspace }}/packages/web-integration/midscene_run/report
        if-no-files-found: ignore

    - name: Run e2e tests report
      uses: ./.github/actions/ai-ci
      with:
        command: pnpm run e2e:report
      id: e2e-tests-report
      continue-on-error: true

    - name: Upload e2e report output
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: e2e-report-output
        path: ${{ github.workspace }}/packages/web-integration/midscene_run/report
        if-no-files-found: ignore

    - name: Check if tests failed
      if: steps.e2e-created-web.outcome == 'failure' || steps.e2e-tests.outcome == 'failure' || steps.e2e-tests-report.outcome == 'failure'
      run: |
        echo "::error::The following e2e tests failed:"
        if [ "${{ steps.e2e-created-web.outcome }}" == "failure" ]; then echo "  - create Web starter"; fi
        if [ "${{ steps.e2e-tests.outcome }}" == "failure" ]; then echo "  - e2e (basic)"; fi
        if [ "${{ steps.e2e-tests-report.outcome }}" == "failure" ]; then echo "  - e2e:report"; fi
        exit 1

  e2e-report:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ${{ fromJSON(vars.LINUX_SELF_HOSTED_RUNNER_LABELS || '"ubuntu-22.04"') }}
    steps:
    - name: Check change detection
      env:
        RESULT: ${{ needs.changes.result }}
      run: test "$RESULT" = success

    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-node-pnpm

    - name: Cache pnpm store
      id: pnpm-cache
      uses: ./.github/actions/pnpm-cache/restore

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Save pnpm store
      if: steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/pnpm-cache/save

    - name: Setup Puppeteer browser
      uses: ./.github/actions/setup-puppeteer-browser

    - name: Build report runtime
      run: |
        pnpm exec nx run-many --target=build --projects="@midscene/report,@midscene/cli"
        node scripts/validate-core-report-template.mjs

    - name: Generate shared report fixtures
      uses: ./.github/actions/ai-ci
      with:
        command: node apps/report/scripts/generate-demo-report.mjs

    - name: Prepare AI CI
      id: ai-ci
      uses: ./.github/actions/ai-ci

    - name: Run apps/report e2e
      id: e2e-tests-app-report
      uses: web-infra-dev/midscene-action@94837f568181d3e855a22a4854f4a2191ac82a6a # v1.0.2
      env:
        NODE_OPTIONS: ${{ steps.ai-ci.outputs.node-options }}
      with:
        working-directory: apps/report
        command: python3 ../../scripts/ci-measure.py "$RUNNER_TEMP/report-resources.json" node ../../packages/test/bin/midscene-test --config ./midscene.config.ts
        artifact-name: e2e-app-report-output
        publish-pages: true
        cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    - name: Upload report resource measurements
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: report-resources
        path: ${{ runner.temp }}/report-resources.json
        retention-days: 7
        if-no-files-found: ignore
