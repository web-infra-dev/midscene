name: Android Remote Device E2E

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: 'Commit SHA or branch to validate'
        required: true
        default: 'main'
        type: string
      video_bit_rate:
        description: 'scrcpy video bitrate in bits per second'
        required: true
        default: '100000000'
        type: string
      iterations:
        description: 'Number of alternating Settings actions'
        required: true
        default: '5'
        type: string

permissions:
  contents: read

concurrency:
  group: android-remote-device-e2e
  cancel-in-progress: false

jobs:
  android-remote-device-e2e:
    # Configure this environment with required reviewers and a short-lived
    # TMATES_JWT or USER_JWT_TOKEN secret before enabling the workflow.
    environment: android-device-farm
    runs-on: [self-hosted, linux]
    timeout-minutes: 35
    env:
      CI: '1'
      FORCE_COLOR: '0'
      MIDSCENE_RUN_DIR: ${{ github.workspace }}/midscene_run
      MIDSCENE_ANDROID_DIAGNOSTICS_DIR: ${{ github.workspace }}/midscene_run/android-remote-scrcpy-diagnostics
      MIDSCENE_ANDROID_SCRCPY_VIDEO_BIT_RATE: ${{ inputs.video_bit_rate }}
      MIDSCENE_ANDROID_REMOTE_SCRCPY_ITERATIONS: ${{ inputs.iterations }}

    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'

      - name: Cache pnpm store
        id: pnpm-cache
        uses: ./.github/actions/pnpm-cache/restore

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Save pnpm store
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/pnpm-cache/save

      - name: Build Android package
        run: pnpm exec nx build @midscene/android --skip-nx-cache

      - name: Acquire remote Android device
        id: acquire
        shell: bash
        env:
          DEVICE_FARM_TOKEN: ${{ secrets.TMATES_JWT || secrets.USER_JWT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DEVICE_FARM_TOKEN" ]]; then
            echo 'Configure TMATES_JWT or USER_JWT_TOKEN in the protected android-device-farm environment.' >&2
            exit 1
          fi
          mkdir -p "$MIDSCENE_ANDROID_DIAGNOSTICS_DIR"
          response=$(pnpm --config.registry=https://bnpm.byted.org dlx \
            @byted-midscene/device-farm acquire-device \
            --auth-token "$DEVICE_FARM_TOKEN" \
            --group-id 6321 \
            --platform android \
            --time 1800)
          printf '%s\n' "$response" > "$MIDSCENE_ANDROID_DIAGNOSTICS_DIR/device-farm-acquire.json"
          serial=$(printf '%s' "$response" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              if (!result.success || !result.data?.serial) process.exit(1);
              process.stdout.write(result.data.serial);
            });
          ')
          adb_address=$(printf '%s' "$response" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              const data = result.data || {};
              const address = data.adbdAddress || data.adbAddress || data.address_v6 || data.address;
              if (!address) process.exit(1);
              process.stdout.write(address);
            });
          ')
          {
            printf 'serial=%s\n' "$serial"
            printf 'adb_address=%s\n' "$adb_address"
          } >> "$GITHUB_OUTPUT"

      - name: Connect remote Android device
        shell: bash
        env:
          ADB_ADDRESS: ${{ steps.acquire.outputs.adb_address }}
          REMOTE_SERIAL: ${{ steps.acquire.outputs.serial }}
        run: |
          set -euo pipefail
          adb connect "$ADB_ADDRESS"
          adb -s "$REMOTE_SERIAL" wait-for-device
          adb -s "$REMOTE_SERIAL" get-state

      - name: Run remote scrcpy freshness E2E
        shell: bash
        env:
          MIDSCENE_ANDROID_REMOTE_SERIAL: ${{ steps.acquire.outputs.serial }}
        run: bash packages/android/scripts/run-remote-device-scrcpy-e2e.sh

      - name: Upload remote Android evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-remote-scrcpy-evidence-${{ github.run_attempt }}
          path: midscene_run
          if-no-files-found: warn
          retention-days: 14

      - name: Release remote Android device
        if: always() && steps.acquire.outputs.serial != ''
        shell: bash
        env:
          DEVICE_FARM_TOKEN: ${{ secrets.TMATES_JWT || secrets.USER_JWT_TOKEN }}
          REMOTE_SERIAL: ${{ steps.acquire.outputs.serial }}
        run: |
          set -euo pipefail
          pnpm --config.registry=https://bnpm.byted.org dlx \
            @byted-midscene/device-farm release-device \
            --auth-token "$DEVICE_FARM_TOKEN" \
            --serial "$REMOTE_SERIAL"
