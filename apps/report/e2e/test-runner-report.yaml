target:
  serve: ./dist
  url: demo-test-runner.html
tasks:
  - name: batch health is visible before debug details
    flow:
      - sleep: 3000
      - aiAssert: The Test Runner overview says Passed with retries and clearly shows a 100% final pass rate, a 50% first-pass rate, one case passed after retry, two total passed cases, and an 8 second Total runner time.
      - aiAssert: The report has one Overview page with no Overview/Cases tab bar and no View all cases action. Its Breakdown is one Project-to-Case tree with search, status filtering, sorting, and a Case rows control set to Compact by default. The Web regression root shows Project-level health at a glance and is collapsed by default because it passed after retry rather than containing a final failure. A separate icon action opens the Project overview.

  - name: project breakdown expands cases and opens the project overview
    flow:
      - javascript: |
          (function () {
            const tree = document.querySelector(
              '[aria-label="Project and case breakdown"]',
            );
            const expandButton = document.querySelector(
              'button[aria-label="Expand project Web regression"]',
            );
            if (!(tree instanceof HTMLElement)) {
              throw new Error('Project breakdown tree was not found.');
            }
            if (document.querySelector('.runner-project-tree-children')) {
              throw new Error(
                'The retry-passed Project should be collapsed by default.',
              );
            }
            if (!(expandButton instanceof HTMLButtonElement)) {
              throw new Error('Collapsed Web regression Project was not found.');
            }
            expandButton.click();
            return { label: expandButton.getAttribute('aria-label') };
          })()
        name: assertRetryProjectCollapsedAndExpand
      - sleep: 300
      - aiAssert: The Web regression Project tree node is expanded. Checkout with retry and Verify cart summary appear as short connected child rows with their own statuses, durations, attempt counts, and source files. The retry row identifies the failed Step without repeating the full error message.
      - javascript: |
          (function () {
            const items = Array.from(
              document.querySelectorAll('.runner-project-tree-case-item'),
            );
            const lastItem = items.at(-1);
            if (!(lastItem instanceof HTMLLIElement)) {
              throw new Error('The last Project Case tree item was not found.');
            }
            const connector = getComputedStyle(lastItem, '::before');
            const connectorBottom = Number.parseFloat(connector.bottom);
            const expectedBottom = lastItem.getBoundingClientRect().height / 2;
            if (Math.abs(connectorBottom - expectedBottom) > 1) {
              throw new Error(
                'The final tree connector extends past the last Case node.',
              );
            }
            const clippedHeading = items
              .map((item) => item.querySelector('h3'))
              .find(
                (heading) =>
                  heading instanceof HTMLElement &&
                  (heading.scrollWidth > heading.clientWidth + 1 ||
                    heading.scrollHeight > heading.clientHeight + 1),
              );
            if (clippedHeading) {
              throw new Error('A Project Case title is visually clipped.');
            }
            const tallestCompactRow = Math.max(
              ...items.map(
                (item) =>
                  item.querySelector('.runner-project-tree-case')
                    ?.getBoundingClientRect().height ?? 0,
              ),
            );
            if (tallestCompactRow > 44) {
              throw new Error(
                'Compact Case rows are taller than expected: ' +
                  tallestCompactRow,
              );
            }
            return {
              connectorBottom,
              expectedBottom,
              tallestCompactRow,
              visibleTitles: items.map((item) =>
                item.querySelector('h3')?.textContent?.trim(),
              ),
            };
          })()
        name: assertProjectTreeConnectorsAndTitles
      - aiTap: the Breakdown status filter that currently says All cases
      - aiTap: the Needs attention option
      - aiAssert: The Project tree is still visible but now only Checkout with retry remains as a Case child; the passed Verify cart summary Case is filtered out.
      - aiTap: the Breakdown status filter that currently says Needs attention
      - aiTap: the All cases option
      - aiAssert: Both Checkout with retry and Verify cart summary are visible again under Web regression.
      - javascript: |
          (function () {
            const overviewButton = document.querySelector(
              'button[aria-label="Open project overview Web regression"]',
            );
            if (!(overviewButton instanceof HTMLButtonElement)) {
              throw new Error('Project overview action was not found.');
            }
            overviewButton.click();
            return { label: overviewButton.textContent.trim() };
          })()
        name: openProjectOverviewFromTree
      - sleep: 500
      - aiAssert: A dedicated Web regression Project workspace is open. It has Project health metrics and contains both Checkout with retry and Verify cart summary as this Project's cases.
      - javascript: |
          (function () {
            const params = new URLSearchParams(window.location.hash.slice(1));
            if (params.get('runner-page') !== 'project') {
              throw new Error('Project route was not written to the URL.');
            }
            if (document.querySelector('nav[aria-label="Report sections"]')) {
              throw new Error('The removed report section tabs are still visible.');
            }
            window.history.back();
            return { hash: window.location.hash };
          })()
        name: browserBackFromProject
      - sleep: 500
      - javascript: |
          (function () {
            if (!document.querySelector('.runner-overview')) {
              throw new Error('Browser Back did not restore the Overview.');
            }
            window.history.forward();
            return { hash: window.location.hash };
          })()
        name: browserForwardToProject
      - sleep: 500
      - aiAssert: Browser Forward restored the dedicated Web regression Project workspace, proving that report page navigation participates in browser history.

  - name: overview switches between compact and detailed case rows
    flow:
      - javascript: |
          (function () {
            const backButton = document.querySelector('.runner-back-button');
            if (!(backButton instanceof HTMLButtonElement)) {
              throw new Error('Project back button was not found.');
            }
            backButton.click();
            return { label: backButton.textContent.trim() };
          })()
        name: returnToOverview
      - sleep: 500
      - javascript: |
          (function () {
            const expandButton = document.querySelector(
              'button[aria-label="Expand project Web regression"]',
            );
            if (expandButton instanceof HTMLButtonElement) {
              expandButton.click();
            }
            const detailedOption = Array.from(
              document.querySelectorAll(
                '.runner-breakdown-view-switch .ant-segmented-item',
              ),
            ).find((option) => option.textContent.trim() === 'Detailed');
            if (!(detailedOption instanceof HTMLElement)) {
              throw new Error('Detailed Case row option was not found.');
            }
            detailedOption.click();
            return { mode: detailedOption.textContent.trim() };
          })()
        name: switchToDetailedRows
      - sleep: 500
      - aiAssert: The Overview remains grouped as a Project tree, but the expanded Web regression Project now shows detailed Case rows. Checkout with retry appears before Verify cart summary and each row includes status, project, platform, source file, duration, attempt count, a short Step story, and a numbered time-scaled visual timeline on the right. The retry Case also has a concise failure summary and an Inspect failure action.
      - javascript: |
          (function () {
            const timeline = document.querySelector(
              '.runner-project-tree-children.is-detailed .runner-visual-timeline',
            );
            if (!(timeline instanceof HTMLElement)) {
              throw new Error('Detailed Case visual timeline was not found.');
            }
            const frames = timeline.querySelectorAll(
              '.runner-visual-timeline-frame',
            );
            if (frames.length < 2) {
              throw new Error(
                'Expected at least two timeline frames, got ' + frames.length,
              );
            }
            const overflowX = getComputedStyle(timeline).overflowX;
            if (overflowX !== 'hidden') {
              throw new Error('Dense timeline frames are not clipped as one track.');
            }
            if (
              !timeline
                .getAttribute('aria-label')
                ?.includes(frames.length + ' frames')
            ) {
              throw new Error('Timeline does not expose its complete frame count.');
            }
            const frameNodes = Array.from(
              timeline.querySelectorAll('.runner-visual-timeline-track > li'),
            );
            if (
              frameNodes.some(
                (frame) => getComputedStyle(frame).position !== 'absolute',
              )
            ) {
              throw new Error('Timeline frames are not time-positioned.');
            }
            return {
              frames: frames.length,
              clientWidth: timeline.clientWidth,
              scrollWidth: timeline.scrollWidth,
            };
          })()
        name: assertDetailedTimelineFits
      - javascript: |
          (function () {
            const frames = document.querySelectorAll(
              '.runner-project-tree-children.is-detailed .runner-visual-frame',
            );
            const frame = frames[1];
            if (!(frame instanceof HTMLElement)) {
              throw new Error('Second detailed timeline frame was not found.');
            }
            const rect = frame.getBoundingClientRect();
            const eventOptions = {
              bubbles: true,
              clientX: rect.left + rect.width / 2,
              clientY: rect.top + rect.height / 2,
              view: window,
            };
            frame.dispatchEvent(new MouseEvent('mouseover', eventOptions));
            frame.dispatchEvent(new MouseEvent('mouseenter', eventOptions));
            frame.dispatchEvent(new MouseEvent('mousemove', eventOptions));
            return { frame: frame.textContent.trim() };
          })()
        name: hoverDetailedTimelineFrame
      - sleep: 500
      - javascript: |
          (function () {
            const preview = document.querySelector(
              '.runner-frame-preview-tooltip .runner-frame-preview img',
            );
            if (!(preview instanceof HTMLImageElement)) {
              throw new Error('Detailed timeline preview was not shown.');
            }
            if (!preview.alt.includes('enlarged frame 2')) {
              throw new Error('Unexpected enlarged frame: ' + preview.alt);
            }
            return { alt: preview.alt };
          })()
        name: assertDetailedTimelinePreview
      - javascript: |
          (function () {
            const frame = document.querySelectorAll(
              '.runner-project-tree-children.is-detailed .runner-visual-frame',
            )[1];
            if (frame instanceof HTMLElement) {
              frame.dispatchEvent(
                new MouseEvent('mouseout', { bubbles: true, view: window }),
              );
              frame.dispatchEvent(
                new MouseEvent('mouseleave', { bubbles: true, view: window }),
              );
            }
            const compactOption = Array.from(
              document.querySelectorAll(
                '.runner-breakdown-view-switch .ant-segmented-item',
              ),
            ).find((option) => option.textContent.trim() === 'Compact');
            if (!(compactOption instanceof HTMLElement)) {
              throw new Error('Compact Case row option was not found.');
            }
            compactOption.click();
            return { mode: compactOption.textContent.trim() };
          })()
        name: switchBackToCompactRows
      - sleep: 300
      - javascript: |
          (function () {
            if (
              document.querySelector(
                '.runner-project-tree-children.is-detailed, .runner-project-tree .runner-visual-timeline',
              )
            ) {
              throw new Error('Detailed evidence remained in Compact mode.');
            }
            const rows = Array.from(
              document.querySelectorAll('.runner-project-tree-case'),
            );
            if (!rows.length) {
              throw new Error('Compact Case rows were not restored.');
            }
            const tallestRow = Math.max(
              ...rows.map((row) => row.getBoundingClientRect().height),
            );
            if (tallestRow > 44) {
              throw new Error('Compact Case rows are too tall: ' + tallestRow);
            }
            const detailedOption = Array.from(
              document.querySelectorAll(
                '.runner-breakdown-view-switch .ant-segmented-item',
              ),
            ).find((option) => option.textContent.trim() === 'Detailed');
            if (!(detailedOption instanceof HTMLElement)) {
              throw new Error('Detailed Case row option was not found.');
            }
            detailedOption.click();
            return { tallestRow };
          })()
        name: assertCompactRowsAndRestoreDetailedMode
      - sleep: 300

  - name: failed Attempt and custom Node remain debuggable
    flow:
      - javascript: |
          (function () {
            const caseRow = Array.from(
              document.querySelectorAll('.runner-case-title-button'),
            ).find(
              (button) =>
                button.querySelector('h3')?.textContent?.trim() ===
                'Checkout with retry',
            );
            if (!(caseRow instanceof HTMLButtonElement)) {
              throw new Error('Checkout with retry Case row was not found.');
            }
            caseRow.click();
            return { label: caseRow.getAttribute('aria-label') };
          })()
        name: openRetryCase
      - sleep: 500
      - aiAssert: The Case workspace opens on successful Attempt 2. A full-width visual timeline sits above a two-column debugging workbench with the grouped execution Steps on the left and the selected aiAct evidence on the right.
      - javascript: |
          (function () {
            const timeline = document.querySelector(
              '.runner-detail-timeline-card',
            );
            const stepPanel = document.querySelector(
              '.runner-detail-step-panel',
            );
            const evidencePanel = document.querySelector(
              '.runner-detail-evidence-panel',
            );
            if (!timeline || !stepPanel || !evidencePanel) {
              throw new Error('The detail debugging workbench is incomplete.');
            }
            const selectedStep = stepPanel.querySelector(
              'button.is-selected strong',
            )?.textContent?.trim();
            if (selectedStep !== 'aiAct') {
              throw new Error('The successful Agent Step is not selected.');
            }
            return {
              selectedStep,
              timelineFrames: timeline.querySelectorAll(
                '.runner-detail-timeline-frame',
              ).length,
            };
          })()
        name: assertDetailDebuggingWorkbench
      - javascript: |
          (function () {
            const frame = document.querySelector(
              '.runner-detail-timeline-frame',
            );
            if (!(frame instanceof HTMLButtonElement)) {
              throw new Error('Detail timeline frame was not found.');
            }
            frame.focus();
            return { label: frame.getAttribute('aria-label') };
          })()
        name: previewDetailTimelineFrame
      - sleep: 300
      - javascript: |
          (function () {
            const preview = document.querySelector(
              '.runner-detail-timeline-preview-callout',
            );
            const selectedStep = document.querySelector(
              '.runner-detail-step-panel button.is-selected strong',
            )?.textContent?.trim();
            if (!preview) {
              throw new Error('Focused timeline frame did not show a preview.');
            }
            if (selectedStep !== 'aiAct') {
              throw new Error('Previewing a frame changed the locked Step.');
            }
            const frame = document.querySelector(
              '.runner-detail-timeline-frame',
            );
            if (!(frame instanceof HTMLButtonElement)) {
              throw new Error('Detail timeline frame disappeared.');
            }
            frame.click();
            return { selectedStep };
          })()
        name: assertPreviewKeepsStepAndLockFrame
      - sleep: 300
      - javascript: |
          (function () {
            const attemptButton = Array.from(
              document.querySelectorAll('.runner-attempt-switcher > button'),
            ).find((button) => button.textContent.includes('Attempt 1'));
            if (!(attemptButton instanceof HTMLButtonElement)) {
              throw new Error('Attempt 1 button was not found.');
            }
            attemptButton.click();
            return { label: attemptButton.textContent.trim() };
          })()
        name: selectFailedAttempt
      - sleep: 300
      - aiAssert: Attempt 1 is selected and the left execution list immediately selects order.create. The right evidence panel shows NODE_EXECUTION_ERROR and explains that Inventory was not ready.
      - javascript: |
          (function () {
            if (
              document.querySelector('.runner-detail-trace-open') ||
              document.querySelector('.runner-detail-trace-new-page')
            ) {
              throw new Error(
                'A Step without Agent details should not offer an AI trace.',
              );
            }
            const tabLabels = Array.from(
              document.querySelectorAll('.runner-detail-inspector-tabs button'),
            ).map((button) => button.textContent.trim());
            if (tabLabels.includes('Summary')) {
              throw new Error('The removed Summary panel is still available.');
            }
            if (!tabLabels.includes('Input & output')) {
              throw new Error('Input & output should be selected by default.');
            }
            return { traceActions: false, tabLabels };
          })()
        name: assertNoTraceForCustomNodeAndNoSummary
      - sleep: 300
      - aiAssert: The order.create Input & output tab keeps the failure context nearby and clearly marks its redacted input data.

  - name: AI trace is progressively disclosed
    flow:
      - javascript: |
          (function () {
            const attemptButton = Array.from(
              document.querySelectorAll('.runner-attempt-switcher > button'),
            ).find((button) => button.textContent.includes('Attempt 2'));
            if (!(attemptButton instanceof HTMLButtonElement)) {
              throw new Error('Attempt 2 button was not found.');
            }
            attemptButton.click();
            return { label: attemptButton.textContent.trim() };
          })()
        name: selectSuccessfulAttempt
      - sleep: 300
      - javascript: |
          (function () {
            const aiActButton = Array.from(
              document.querySelectorAll('.runner-detail-step-group button'),
            ).find(
              (button) =>
                button.querySelector('strong')?.textContent?.trim() === 'aiAct',
            );
            if (!(aiActButton instanceof HTMLButtonElement)) {
              throw new Error('aiAct Step button was not found.');
            }
            aiActButton.click();
            return { label: aiActButton.textContent.trim() };
          })()
        name: inspectAiActStep
      - sleep: 300
      - aiAssert: The aiAct evidence inspector is visible beside the execution list. Only Input & output and Events remain as inspector tabs; Summary is gone. Prominent Inspect AI trace and Open AI trace in new tab actions appear in the Step header above the evidence workspace, and there is no inline trace section below it.
      - javascript: |
          (function () {
            const tabLabels = Array.from(
              document.querySelectorAll('.runner-detail-inspector-tabs button'),
            ).map((button) => button.textContent.trim());
            if (tabLabels.includes('Summary') || tabLabels.includes('AI trace')) {
              throw new Error('Summary and AI trace should not be inspector tabs.');
            }
            if (document.querySelector('.runner-detail-trace-disclosure')) {
              throw new Error('The old inline AI trace disclosure still exists.');
            }
            const openTrace = document.querySelector(
              '.runner-detail-trace-open',
            );
            if (!(openTrace instanceof HTMLButtonElement)) {
              throw new Error('Open AI trace drawer action was not found.');
            }
            if (openTrace.textContent?.trim() !== 'Inspect AI trace') {
              throw new Error('AI trace drawer action label is not explicit.');
            }
            const newPage = document.querySelector(
              '.runner-detail-trace-new-page',
            );
            if (!(newPage instanceof HTMLAnchorElement)) {
              throw new Error('Open AI trace in new page action was not found.');
            }
            if (newPage.textContent?.trim() !== 'Open AI trace in new tab') {
              throw new Error('AI trace new-tab action label is not explicit.');
            }
            const traceUrl = new URL(newPage.href);
            const traceParams = new URLSearchParams(traceUrl.hash.slice(1));
            if (
              newPage.target !== '_blank' ||
              traceParams.get('runner-trace') !== 'page' ||
              traceParams.get('runner-step') !== 'attempt-2:steps:0'
            ) {
              throw new Error('New page action does not preserve the Step deep link.');
            }
            if (!document.querySelector('.runner-detail-screenshot-stage')) {
              throw new Error('Screenshot evidence should remain visible.');
            }
            openTrace.click();
            return {
              label: openTrace.getAttribute('aria-label'),
              tabLabels,
              traceHash: traceUrl.hash,
            };
          })()
        name: openAiTraceDrawerAndVerifyNewPageLink
      - sleep: 1500
      - javascript: |
          (function () {
            const workspace = document.querySelector(
              '.runner-detail-evidence-workspace',
            );
            const drawer = document.querySelector(
              '.runner-detail-trace-drawer',
            );
            const trace = drawer?.querySelector('.runner-detail-trace-view');
            if (!workspace || !trace) {
              throw new Error(
                'Evidence workspace and the AI trace Drawer should both exist.',
              );
            }
            const drawerPanel = drawer.querySelector(
              '.ant-drawer-content-wrapper',
            );
            if (
              !(drawerPanel instanceof HTMLElement) ||
              drawerPanel.getBoundingClientRect().width <
                Math.min(1680, window.innerWidth - 24) * 0.94
            ) {
              throw new Error('AI trace Drawer is not using the expected wide layout.');
            }
            return {
              workspaceVisible: workspace.getBoundingClientRect().height > 0,
              traceVisible: trace.getBoundingClientRect().height > 0,
            };
          })()
        name: assertTraceDrawerPreservesEvidence
      - aiAssert: A wide right-side AI trace Drawer is open and contains the embedded Agent report with its task list and replay or timeline area. The Case evidence workspace remains behind it rather than being pushed down the page.

  - name: Step deep link is namespaced
    flow:
      - javascript: |
          (function () {
            const params = new URLSearchParams(window.location.hash.slice(1));
            const stepId = params.get('runner-step');
            if (stepId !== 'attempt-2:steps:0') {
              throw new Error('Unexpected runner-step hash: ' + stepId);
            }
            return { hash: window.location.hash };
          })()
        name: assertRunnerStepHash
