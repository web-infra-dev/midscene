target:
  serve: ./dist
  url: demo-midscene-test-overview.html
  viewportWidth: 1440
  viewportHeight: 1600
  deviceScaleFactor: 1
tasks:
  - name: grouped project navigation keeps file errors distinct from failed cases
    flow:
      - aiAssert: The summary shows 4 of 5 cases passed, with a result bar and legend showing 3 passed without retry, 0 failed, 1 passed after retry and 1 not run. The run information shows 2 Projects and 6 Files. Web regression is selected under Failed in the left project navigation; its summary includes passed, passed after retry and not-run Case counts without hiding any of these outcomes. Mobile regression is available under Passed. The right table belongs to Web regression and includes blocked.yaml with a not-run Case and Database connection refused, and broken.yaml with a collection error and an unknown Case count.
      - javascript: |
          (() => {
            const table = document.querySelector('.runner-file-table');
            const columns = [...table.tHead.rows[0].cells].map(cell => cell.getBoundingClientRect());
            const width = columns.reduce((sum, cell) => sum + cell.width, 0);
            if (columns.length !== 4 || Math.abs(width - table.getBoundingClientRect().width) > 1) throw new Error('File table contains an unexpected layout column');
            const duration = table.querySelector('.runner-file-duration').getBoundingClientRect();
            if (Math.abs(duration.x - columns[3].x) > 1) throw new Error('Duration values are not aligned with their header');
            for (const cell of table.querySelectorAll('thead th:last-child, .runner-file-duration')) {
              if (getComputedStyle(cell).textAlign !== 'right') throw new Error('Duration headers and values must align to the right');
            }
            for (const item of document.querySelectorAll('.runner-project-nav-item')) {
              const bounds = item.getBoundingClientRect();
              const parent = item.parentElement.getBoundingClientRect();
              const summary = item.querySelector('small');
              if (bounds.right > parent.right + 1) throw new Error('Long project summary expanded its navigation row');
              if (summary.title !== summary.textContent.trim()) throw new Error('Project summary tooltip lost the complete outcome counts');
              if (getComputedStyle(summary).textOverflow !== 'ellipsis') throw new Error('Long project summaries must use an ellipsis');
            }
          })();
        name: verifyFourColumnAlignment
      - aiTap: the Failed checkbox beside the Web regression heading
      - aiAssert: Failed is selected, and blocked.yaml and broken.yaml remain visible because they have file errors. Blocked by document setup is visible as Not run. Mobile regression remains available in the left navigation. The top summary still shows 4 of 5 cases passed.
      - aiTap: the All checkbox beside the Web regression heading
      - aiTap: the Expand file empty.yaml button
      - aiAssert: empty.yaml shows No cases were collected for this file. It has no Case child rows and its Passed / Case cell is a dash.
      - aiTap: the Collapse file empty.yaml button

  - name: expand and collapse all files beside the status filters
    flow:
      - aiTap: the Expand all files button to the right of the status checkboxes
      - aiAssert: All files in Web regression are expanded. Checkout with retry and Smoke checkout are visible, and empty.yaml shows No cases were collected for this file. The toolbar button now offers Collapse all files.
      - aiTap: the Collapse all files button beside the status filters
      - aiAssert: Web regression still shows its file rows, while their Case rows are hidden. The toolbar button now offers Expand all files.

  - name: Project selection preserves independent sorting and Markdown file order
    flow:
      - aiTap: the Duration column header in the Web regression table
      - javascript: |
          (() => {
            const table = document.querySelector('.runner-file-table');
            if (table.querySelector('[aria-sort="descending"]')?.textContent.trim() !== 'Duration') throw new Error('Web duration was not sorted descending');
            const files = [...table.querySelectorAll('.runner-file-path')].map(node => node.textContent);
            if (files.at(-1) !== 'broken.yaml') throw new Error('Unknown duration did not stay last');
          })();
        name: verifyWebSortAndUnknownDuration
      - aiTap: the Select project Mobile regression button in the left navigation
      - aiAssert: Mobile regression is selected and only its table is displayed on the right. Its Files column is ascending, and All is selected.
      - aiTap: the Select project Web regression button in the left navigation
      - aiAssert: Web regression is selected again and its Duration column is still descending.
      - aiTap: the Duration column header in the Web regression table
      - aiAssert: Duration is ascending. empty.yaml with 0 ms precedes files with positive durations.
      - aiTap: the Files column header in the Web regression table
      - javascript: |
          (() => {
            const table = document.querySelector('.runner-file-table');
            const files = [...table.querySelectorAll('.runner-file-path')].map(node => node.textContent);
            if (files.join('|') !== 'checkout.yaml|smoke/checkout.yaml|blocked.yaml|empty.yaml|broken.yaml') throw new Error('Markdown document order was not restored');
            if (table.querySelector('[aria-sort="ascending"]')?.textContent.trim() !== 'Files') throw new Error('Files should sort ascending');
          })();
        name: verifyMarkdownFileOrder
      - aiTap: the Files column header in the Web regression table
      - javascript: |
          (() => {
            const table = document.querySelector('.runner-file-table');
            const files = [...table.querySelectorAll('.runner-file-path')].map(node => node.textContent);
            if (files.join('|') !== 'broken.yaml|empty.yaml|blocked.yaml|smoke/checkout.yaml|checkout.yaml') throw new Error('Files descending did not reverse report order');
            if (table.querySelector('[aria-sort="descending"]')?.textContent.trim() !== 'Files') throw new Error('Web Files should sort descending');
          })();
        name: verifyReverseFileOrder
      - aiTap: the Select project Mobile regression button
      - aiAssert: Mobile regression still uses Files ascending. The sort applied to Web regression has not changed it.
      - aiTap: the Select project Web regression button
      - aiAssert: Web regression still uses Files descending.

  - name: returning from details preserves project filters sort and file expansion
    flow:
      - aiTap: the Passed status checkbox
      - aiInput: checkout
        locate: the search input for projects, files, cases and details
      - aiTap: the Expand file smoke/checkout.yaml button in Web regression
      - aiTap: the Duration column header in the Web regression table
      - aiTap: the Smoke checkout Case row in Web regression
      - aiAssert: The Smoke checkout Case detail shows an Overview back link and an Execution panel.
      - aiTap: the floating menu button labeled View all cases on the left edge of the report
      - aiAssert: The All cases directory opens on the left below the floating menu button, without dimming the report. It lists Web regression and Mobile regression. Smoke checkout is highlighted as the current Case. Checkout with retry and Blocked by document setup are also listed even though the Overview was filtered to passed checkout Cases. Each Case shows its result and source file.
      - javascript: |
          const directory = document.querySelector('.runner-case-drawer');
          const panel = directory?.querySelector('.ant-drawer-content-wrapper');
          const content = directory?.querySelector('.ant-drawer-content');
          const body = directory?.querySelector('.ant-drawer-body');
          const trigger = document.querySelector('.runner-case-browse');
          const steps = document.querySelector('.runner-detail-step-scroll');
          if (![panel, content, body, trigger, steps].every(node => node instanceof HTMLElement)) throw new Error('Missing Case directory layout elements');
          const panelBounds = panel.getBoundingClientRect();
          const triggerBounds = trigger.getBoundingClientRect();
          if (Math.abs(panelBounds.left) > 1 || Math.abs(triggerBounds.left) > 1) throw new Error('The Case directory and menu button must touch the left viewport edge');
          if (panelBounds.top < triggerBounds.bottom || panelBounds.right > innerWidth) throw new Error('The directory overlaps its menu button or overflows the viewport');
          if (panelBounds.right < steps.getBoundingClientRect().right + 8) throw new Error('The default directory width does not cover the underlying Step scrollbar');
          const panelStyle = getComputedStyle(panel);
          if (parseFloat(panelStyle.borderTopRightRadius) <= 0 || panelStyle.overflow !== 'hidden') throw new Error('The directory wrapper must clip its rounded corner');
          const background = getComputedStyle(content).backgroundColor;
          if (getComputedStyle(body).backgroundColor !== background || getComputedStyle(body, '::-webkit-scrollbar-track').backgroundColor !== background) throw new Error('The directory scrollbar track does not match its container');
          const aligned = [directory.querySelector('.ant-drawer-title'), directory.querySelector('.runner-case-list h3'), directory.querySelector('.runner-case-list strong'), directory.querySelector('.runner-case-list small')];
          if (!aligned.every(node => node instanceof HTMLElement)) throw new Error('Missing directory title, Project, Case or File label');
          const left = aligned[0].getBoundingClientRect().left;
          if (aligned.some(node => Math.abs(node.getBoundingClientRect().left - left) > 1)) throw new Error('Directory titles and labels are not left-aligned');
        name: verifyCaseDirectoryLayout
      - javascript: |
          const drawer = document.querySelector('.runner-case-drawer');
          const current = drawer?.querySelector('.runner-case-list [aria-current="page"]');
          if (!(drawer instanceof HTMLElement) || !(current instanceof HTMLButtonElement)) throw new Error('Missing Case directory or current Case');
          if (document.activeElement !== current) throw new Error('Opening the directory did not focus the current Case');
          if (getComputedStyle(drawer).outlineStyle !== 'none') throw new Error('The directory wrapper has a full-page focus outline');
        name: verifyCaseDirectoryFocus
      - aiKeyboardPress: Tab
      - javascript: |
          const drawer = document.querySelector('.runner-case-drawer');
          const focused = document.activeElement;
          if (!(focused instanceof HTMLButtonElement) || !drawer?.contains(focused) || focused.getAttribute('aria-current') === 'page') throw new Error('Tab did not advance to another directory control');
        name: verifyCaseDirectoryKeyboardNavigation
      - aiKeyboardPress: Escape
      - aiAssert: The directory is closed and Smoke checkout is still displayed.
      - javascript: |
          if (document.activeElement !== document.querySelector('.runner-case-browse')) throw new Error('Closing the directory did not return focus to its menu button');
        name: verifyCaseDirectoryFocusReturn
      - aiTap: the floating menu button on the left edge of the report
      - aiTap: the floating menu button labeled View all cases again to close the directory
      - aiAssert: The drawer is closed and Smoke checkout is still displayed.
      - aiTap: the floating menu button on the left edge of the report
      - aiTap: Mobile checkout in the Mobile regression section of the All cases drawer
      - aiAssert: The drawer has closed and the Mobile checkout detail shows Mobile regression and cart.verify. The floating menu button is still available on the left edge.
      - aiTap: the floating menu button on the left edge of the report
      - aiTap: Checkout with retry in the Web regression section of the All cases drawer
      - aiAssert: Checkout with retry is displayed at the failed order.create Step in Attempt 1, showing Inventory was not ready. The drawer is closed.
      - aiTap: the Overview back link
      - aiAssert: Web regression is still selected in the project navigation. Passed is still checked, the search input still contains checkout, Duration is still sorted descending, and smoke/checkout.yaml is still expanded showing Smoke checkout. Checkout with retry is filtered out, while the checkout.yaml parent file still shows 2 of 2 passed without an extra percentage or per-file matching note.

  - name: empty search can be cleared without losing the selected Project
    flow:
      - aiInput: no-report-content-matches-this-query
        locate: the search input for projects, files and cases
      - aiAssert: The focused search field has one blue border without an extra outline around it. The project navigation shows No matching projects, and the main empty state shows No matching projects with a Clear filters button.
      - aiTap: the Clear filters button in the main empty state
      - aiAssert: The search field is empty and its hint mentions projects, files and cases. The sidebar heading is Projects without a total count. Failed 1 appears before Passed 1 in the navigation. Web regression is selected again, All is checked, and the table has Files, Passed / Case, Attention and Duration headers. Its Duration sort remains descending.
