beforeAll:
  - report.open:
      path: demo-agent.html

cases:
  - name: switch between light and dark themes
    steps:
      - aiTap: the theme toggle in the report header
      - aiAssert: The report is in dark theme and its task list remains readable.
      - aiTap: the theme toggle in the report header
      - aiAssert: The report is back in light theme and its task list remains readable.
