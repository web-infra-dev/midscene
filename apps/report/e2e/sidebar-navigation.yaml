target:
  serve: ./dist
  url: demo-agent.html
tasks:
  - name: task selection and URL navigation stay in sync
    flow:
      - aiTap: the first task in the Execution list
      # URL synchronization is DOM plumbing. Visual task navigation stays on AI.
      - javascript: |
          (() => {
            const selected = document.querySelector('.tasks-table .task-row.selected');
            if (!selected?.id || location.hash !== '#' + selected.id) throw new Error('Selected task is not reflected in the URL');
            const next = [...document.querySelectorAll('.tasks-table .task-row')].find(row => row.id && row !== selected);
            if (!next) throw new Error('A second task is required');
            location.hash = next.id;
          })();
        name: navigateViaTaskHash
      - sleep: 500
      - javascript: |
          (() => {
            const selected = document.querySelector('.tasks-table .task-row.selected');
            if (!selected?.id || location.hash !== '#' + selected.id) throw new Error('URL navigation did not select the matching task');
          })();
        name: verifyHashSelection
      - aiAssert: A task is selected and its information is available.

  - name: toggle model call details
    flow:
      - aiTap: Model Call Details
      - aiAssert: Model Call Details is enabled and an Intent column is shown in the task list.
      - aiTap: Model Call Details
      - aiAssert: Model Call Details is disabled and the task list returns to its normal columns.
