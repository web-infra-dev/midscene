target:
  serve: ./dist
  url: demo-midscene-test-view-switch.html
  viewportWidth: 1280
  viewportHeight: 720
  deviceScaleFactor: 1
tasks:
  - name: view switching preserves scroll position and timeline instances
    flow:
      - aiTap: the collapsed Web regression project row to expand its cases
      - aiTap: the View switching case row
      - aiAssert: aiAct is selected and Record shows the recorded Agent task list and screenshot viewer.
      # DOM plumbing: verify positions and object identity, not a visual guess
      # about motion from a single screenshot. Keep navigation/visibility on AI.
      - javascript: |
          (() => {
            const main = document.querySelector('.runner-main');
            const timeline = document.querySelector('.runner-detail-timeline-card');
            const canvas = timeline?.querySelector('canvas');
            if (!main || !timeline || !canvas) throw new Error('Timeline is not ready');
            main.scrollTo({ top: 0 });
            window.reportViewSwitch = {
              main, timeline, canvas,
              scrollTop: main.scrollTop,
              headerTop: document.querySelector('.runner-detail-panel-heading').getBoundingClientRect().top,
            };
          })();
        name: rememberViewPositionAndTimeline
      - aiTap: YAML in the Execution view switch
      - aiAssert: YAML is selected and the captured source shows beforeAll, beforeEach, aiAct, and afterEach.
      - javascript: |
          (() => {
            const state = window.reportViewSwitch;
            if (!state.timeline.isConnected || state.timeline.getClientRects().length) throw new Error('Timeline must remain mounted but hidden');
            if (state.main.scrollTop !== state.scrollTop) throw new Error('YAML changed the scroll position');
          })();
        name: verifyHiddenTimelineIsRetained
      - aiTap: Visual in the Execution view switch
      - javascript: |
          (async () => {
            await new Promise(resolve => setTimeout(resolve, 400));
            const state = window.reportViewSwitch;
            const header = document.querySelector('.runner-detail-panel-heading');
            if (state.main.scrollTop !== state.scrollTop || Math.abs(header.getBoundingClientRect().top - state.headerTop) > 1) throw new Error('Returning to Visual moved the switch');
            if (document.querySelector('.runner-detail-timeline-card') !== state.timeline || state.timeline.querySelector('canvas') !== state.canvas) throw new Error('Returning to Visual recreated the timeline');
            delete window.reportViewSwitch;
          })();
        name: verifyVisualPositionAndTimelineArePreserved
      - aiAssert: Visual and aiAct remain selected. Record shows the recorded Agent task list and screenshot viewer.

  - name: clicking YAML steps still reveals and focuses their details
    flow:
      - aiTap: YAML in the Execution view switch
      - aiTap: the blue aiAct key before the colon in the YAML source, not the prompt text below it
      - aiAssert: Visual is selected again. The selected aiAct row and its details are visible, with the recorded Agent task list and screenshot viewer.
      - javascript: |
          (() => {
            const selected = document.querySelector('.runner-detail-step-list > .is-selected');
            const rect = selected?.getBoundingClientRect();
            if (!selected || document.activeElement !== selected || rect.top < 56 || rect.bottom > innerHeight) throw new Error('The existing selection was not revealed and focused');
          })();
        name: verifySameYamlStepIsRevealed
      - aiTap: YAML in the Execution view switch
      - aiTap: the green success check marker on the browser.open line in the YAML source
      - aiAssert: Visual is selected. browser.open is selected in the left execution pane and its Browser opened details are visible on the right.
      - javascript: |
          (() => {
            const selected = document.querySelector('.runner-detail-step-list > .is-selected');
            if (!selected?.textContent.includes('browser.open') || document.activeElement !== selected) throw new Error('The new YAML selection was not focused');
          })();
        name: verifyDifferentYamlStepIsRevealed
