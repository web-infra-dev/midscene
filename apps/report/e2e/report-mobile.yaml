target:
  serve: ./dist
  url: demo-agent.html
  viewportWidth: 390
  viewportHeight: 844
  deviceScaleFactor: 1
tasks:
  - name: inspect an Agent task on mobile and return to the Steps list
    flow:
      - aiAssert: The mobile report has Steps selected and shows the task list.
      - aiTap:
          locate:
            prompt: the first execution task row starting with Plan, below the Act heading
            deepLocate: true
      - aiAssert: Player is selected, the task's player content is visible, and an Information action is available.
      - aiTap: Information in the Record header
      - aiAssert: The task information drawer is open and shows Param information.
      - aiTap: the close button in the task information drawer
      - aiAssert: The drawer is closed and the task's player content is visible again.
      - aiTap: JSON View in the task detail view switch
      - aiAssert: The selected task's JSON data is visible, including taskId and status.
      - aiTap:
          locate:
            prompt: Copy JSON, the copy icon button in the task detail toolbar
            deepLocate: true
      - aiAssert: A success message confirms the JSON was copied to the clipboard.
      - aiTap: Steps in the mobile report switch
      - aiAssert: The task list is visible again with Steps selected.
