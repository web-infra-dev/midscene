target:
  serve: ./dist
  url: demo-agent.html
  viewportWidth: 390
  viewportHeight: 844
  deviceScaleFactor: 1
tasks:
  - name: mobile report switches from steps to player
    flow:
      - sleep: 2000
      - aiAssert: The narrow report shows a Steps and Player switch at the top. Steps is selected, and the task list is visible without a side-by-side player pane.
      - javascript: |
          (function () {
            const tabs = document.querySelector('.mobile-report-tabs');
            const steps = document.querySelector('.main-layout > .page-side');
            if (!(tabs instanceof HTMLElement) || !(steps instanceof HTMLElement)) {
              throw new Error('Mobile report tabs or Steps pane is missing');
            }
            const gap = steps.getBoundingClientRect().top - tabs.getBoundingClientRect().bottom;
            if (Math.abs(gap - 8) > 1) {
              throw new Error(`Expected an 8px gap below mobile tabs, received ${gap}px`);
            }
            return { tabsToContentGap: gap };
          })()
        name: assertMobileTabSpacing
      - javascript: |
          (function () {
            const row = document.querySelector('.tasks-table .task-row');
            if (!(row instanceof HTMLElement)) {
              throw new Error('No task row found in the mobile Steps list');
            }
            row.click();
            return { selectedTaskId: row.getAttribute('data-task-id') };
          })()
        name: selectMobileTaskRow
      - sleep: 500
      - javascript: |
          (function () {
            const playerButton = document.querySelector(
              '.mobile-report-tabs button[aria-pressed="true"]',
            );
            if (playerButton?.textContent?.trim() !== 'Player') {
              throw new Error('Task selection did not switch to Player');
            }
            const informationPanel = document.querySelector(
              '.desktop-detail-layout > .information-panel',
            );
            if (
              informationPanel instanceof HTMLElement &&
              getComputedStyle(informationPanel).display !== 'none'
            ) {
              throw new Error('Desktop information panel is visible on mobile');
            }
            const drawer = document.querySelector('#mobile-detail-drawer');
            if (drawer?.getAttribute('aria-hidden') !== 'true') {
              throw new Error('Mobile information drawer should start closed');
            }
            const recordLabel = document.querySelector(
              '.main-right-header span',
            );
            if (
              !(recordLabel instanceof HTMLElement) ||
              recordLabel.getBoundingClientRect().left < 0
            ) {
              throw new Error('Record label is clipped by the information trigger');
            }
            return { selectedPane: 'Player', detailDrawer: 'closed' };
          })()
        name: assertMobilePaneSwitch
      - aiAssert: Player is selected. The Steps task list is hidden, the report player content is visible, and there is an Information button in the Record header.
      - javascript: |
          (function () {
            const trigger = document.querySelector('.mobile-detail-trigger');
            if (!(trigger instanceof HTMLButtonElement)) {
              throw new Error('Mobile information trigger is missing');
            }
            trigger.click();
          })()
        name: openMobileInformation
      - sleep: 250
      - javascript: |
          (function () {
            const drawer = document.querySelector('#mobile-detail-drawer');
            const close = drawer?.querySelector('.detail-side-close');
            if (!(drawer instanceof HTMLElement) || !(close instanceof HTMLButtonElement)) {
              throw new Error('Mobile information drawer or close button is missing');
            }
            const bounds = drawer.getBoundingClientRect();
            if (drawer.getAttribute('aria-hidden') !== 'false') {
              throw new Error('Mobile information drawer did not open');
            }
            if (Math.abs(bounds.width - window.innerWidth) > 1) {
              throw new Error(
                `Mobile information drawer is ${bounds.width}px wide; expected ${window.innerWidth}px`,
              );
            }
            close.click();
            return { drawerWidth: bounds.width };
          })()
        name: assertAndCloseMobileInformation
      - sleep: 250
      - javascript: |
          (function () {
            const drawer = document.querySelector('#mobile-detail-drawer');
            if (drawer?.getAttribute('aria-hidden') !== 'true') {
              throw new Error('Mobile information drawer did not close');
            }
            return { detailDrawer: 'closed' };
          })()
        name: assertMobileInformationClosed
      - javascript: |
          (function () {
            const jsonView = Array.from(
              document.querySelectorAll('.ant-segmented-item'),
            ).find((item) => item.textContent?.includes('JSON View'));
            if (!(jsonView instanceof HTMLElement)) {
              throw new Error('JSON View control is missing');
            }
            jsonView.click();
            const copy = document.querySelector('.copy-json-link');
            const copyLabel = document.querySelector('.copy-json-label');
            const playground = document.querySelector(
              '.open-in-playground-trigger',
            );
            if (!(copy instanceof HTMLButtonElement)) {
              throw new Error('Copy JSON is not a button');
            }
            const copyBounds = copy.getBoundingClientRect();
            if (copy.getAttribute('aria-label') !== 'Copy JSON') {
              throw new Error('Copy JSON icon button is missing its accessible label');
            }
            if (
              !(copyLabel instanceof HTMLElement) ||
              getComputedStyle(copyLabel).display !== 'none'
            ) {
              throw new Error('Copy JSON text should be hidden on mobile');
            }
            if (copyBounds.width < 44 || copyBounds.height < 44) {
              throw new Error('Copy JSON mobile touch target is too small');
            }
            if (
              playground instanceof HTMLElement &&
              getComputedStyle(playground).display !== 'none'
            ) {
              throw new Error('Open in Playground should be hidden on mobile');
            }
            return {
              copyButtonSize: [copyBounds.width, copyBounds.height],
              playground: 'hidden',
            };
          })()
        name: assertMobileJsonActions
      - aiTap: the Steps button in the top report view switch
      - aiAssert: Steps is selected again, and the task list is visible.
