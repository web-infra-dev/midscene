beforeAll:
  - report.open:
      path: demo-midscene-test-late-failure.html
      viewportWidth: 1280
      viewportHeight: 900
      deviceScaleFactor: 1

cases:
  - name: opening a failed Case reveals its failed Step
    steps:
      - aiAssert: The overview includes Failure after many steps with a failed result.
      - aiTap: the Failure after many steps Case
      # Entry navigation must reveal a late failure without manual scrolling.
      - aiAssert: The failed order.submit Step is selected and visible. Its error says Order submission failed after preparation.
