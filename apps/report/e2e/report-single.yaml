target:
  serve: ./dist
  url: demo.html
tasks:
  # --- Basic loading ---
  - name: report loads and displays tasks
    flow:
      - sleep: 5000
      - aiAssert: The report page is loaded with a left-side task list table showing multiple named task rows and a time or duration column; the main report panel also shows a "Record" timeline with visible screenshot thumbnails or frame previews.

  # --- Report timing summary ---
  - name: total row distinguishes elapsed time from model call time
    flow:
      - aiScroll: the scrollable left-side Execution task list below the Type and Time headers, not the main Record timeline
        scrollType: scrollToBottom
      - sleep: 500
      - aiAssert: The left-side Execution task list is visibly scrolled to its bottom. Below the task rows there is one combined summary row labeled "Total" whose Time cell contains separate "Elapsed" and "Model" duration values; there is no separate row labeled "Total Time".

  # --- Player area visible with controls ---
  - name: player area is visible with playback controls
    flow:
      # The timing-summary check leaves the task list at the bottom. Replay is
      # only available for Planning tasks with animation scripts. The sidebar
      # renders that internal type as "Plan", so return to the top and select
      # the matching visible row.
      - aiScroll: the scrollable left-side Execution task list below the Type and Time headers, not the main Record timeline
        scrollType: scrollToTop
      - sleep: 500
      - aiTap: a task row in the left sidebar whose Type cell is exactly "Plan", not an Insight or Locate row and not the Total summary row
      - sleep: 2000
      - aiTap:
          locate:
            prompt: >-
              the black triangular report-wide replay button at the far right
              of the top-left sidebar toolbar, immediately to the right of
              "Switch: Command ..."; not a task row, timeline thumbnail, or
              video player control
      - sleep: 1000
      - aiAssert: There is a video player area with a progress bar and playback time display

  # --- Settings popup ---
  - name: settings popup opens and shows options
    flow:
      - aiHover:
        locate:
          prompt: the central video player replay area, not the timeline thumbnails and not the left task sidebar
          deepLocate: true
      - sleep: 300
      - aiTap:
        locate:
          prompt: the visible settings button in the bottom playback control bar. It is the small hexagon or gear-shaped icon in the right-side control group, immediately left of the fullscreen icon and right of the progress bar.
          deepLocate: true
      - sleep: 1000
      - aiAssert: The player settings popup is open above the bottom-right control bar, showing options such as "Focus on cursor", "Subtitle", "Playback speed", and speed choices like "0.5x", "1x", "1.5x", or "2x".

  # --- Markdown timing summary ---
  # Keep this last: Markdown View replaces the task list, and no later scenario
  # should depend on an AI-located switch back to Human View.
  - name: markdown view explains both timing metrics
    flow:
      - aiTap:
          locate:
            prompt: the "Markdown View" button in the two-button Report view switch at the far upper-left of the sidebar; it is the document-shaped icon next to the speech-bubble Human View icon, not the copy or download buttons farther right
      - sleep: 500
      - aiAssert: The left sidebar is showing report Markdown source with a "Timing Summary" section that clearly lists both "Elapsed Time" and "Model Call Time".
