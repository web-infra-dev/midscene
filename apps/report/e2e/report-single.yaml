# Keep these checks in one Case: later sections use the page state left by earlier ones.
beforeAll:
  - report.open:
      path: demo-agent.html
      deviceScaleFactor: 1

cases:
  - name: Agent report loading, timing, replay, settings and Markdown
    steps:
      # load the Agent report
      - aiAssert: The report loads with an Execution task list and screenshot evidence in the Record area.

      # inspect elapsed and model timing totals
      - aiScroll:
          prompt: the Execution task list
          options:
            scrollType: scrollToBottom
      - aiAssert: The task list's Total summary distinguishes Elapsed and Model durations.
      - aiScroll:
          prompt: the Execution task list
          options:
            scrollType: scrollToTop

      # replay tasks and open player settings
      - aiTap: a Plan task in the Execution list
      - aiTap:
          prompt: Replay all tasks, the black play icon beside Switch at the top of the left Execution sidebar, not the Replay tab
          options:
            deepLocate: true
      # Verify the mode switch as browser plumbing; keep playback coverage on AI.
      # verifyReplayAllMode
      - javascript:
          script: |
            (() => {
              if (!document.querySelector('.replay-all-mode-wrapper')) throw new Error('Replay all mode did not open');
            })();
      - aiHover:
          prompt: the large replay canvas below the Record timeline, outside the left task list and timeline thumbnails
          options:
            deepLocate: true
      - aiAssert: The main Record area shows the replay player with play or pause and seek controls.
      - aiHover:
          prompt: the large replay canvas below the Record timeline, outside the left task list and timeline thumbnails
          options:
            deepLocate: true
      - aiTap:
          prompt: the visible Settings button in the bottom playback control bar, the gear-shaped icon immediately left of Fullscreen and right of the progress bar
          options:
            deepLocate: true
      - aiAssert: Player settings are open with playback speed options.

      # inspect the Markdown report
      - aiTap: Markdown View in the report view switch
      - aiAssert: The report Markdown includes a Timing Summary with Elapsed Time and Model Call Time.
