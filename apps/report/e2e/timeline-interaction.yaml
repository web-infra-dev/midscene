target:
  serve: ./dist
  url: demo.html
tasks:
  - name: legacy YAML opens the Test report timeline
    flow:
      - sleep: 2000
      - aiAssert: The header shows Test Report next to the Midscene logo. The overview has web selected in the Projects navigation on the left, and its Files table on the right shows the collapsed generate-report.yaml File.
      - aiTap: the expand chevron for the generate-report.yaml File row in the web project's table
      - aiAssert: The login to sauce demo and verify inventory page Cases are visible beneath the expanded generate-report.yaml File.
      - aiTap: the login to sauce demo Case row beneath generate-report.yaml
      - aiAssert: The login to sauce demo case detail is open with an Overview back link, an Execution panel, and a Visual timeline containing captured screenshots

  - name: click timeline screenshot to inspect evidence
    flow:
      - aiTap: a screenshot in the full width Visual timeline
      - sleep: 1000
      - aiAssert: The corresponding Agent-backed aiAct step is selected in the Execution panel
      - javascript: |
          const evidence = document.querySelector('.runner-detail-evidence-panel');
          if (!(evidence instanceof HTMLElement)) throw new Error('Missing aiAct evidence panel');
          evidence.scrollIntoView({ block: 'start' });
        name: revealSelectedStepEvidence
      - aiAssert: The visible aiAct evidence panel shows Record, Information, and Events tabs. Record is selected, and its embedded Agent report shows an Execution action list and a screenshot timeline.
