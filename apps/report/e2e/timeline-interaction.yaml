target:
  serve: ./dist
  url: demo.html
tasks:
  - name: legacy YAML opens the Test report timeline
    flow:
      - sleep: 2000
      - aiAssert: The Midscene Test Report overview is visible with a web project in the Projects and cases section
      - aiTap: the expand chevron to the left of the web project
      - aiAssert: The login to sauce demo and verify inventory page cases are visible under the web project
      - aiTap: the login to sauce demo case row under the web project
      - aiAssert: The login to sauce demo case detail is open with an Overview back link, an Execution panel, and a Visual timeline containing captured screenshots

  - name: click timeline screenshot to inspect evidence
    flow:
      - aiTap: a screenshot in the full width Visual timeline
      - sleep: 1000
      - aiAssert: A captured screenshot is selected in the Visual timeline and its corresponding Agent-backed step is selected in the Execution panel with evidence details visible
