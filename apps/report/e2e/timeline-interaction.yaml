target:
  serve: ./dist
  url: demo.html
tasks:
  - name: inspect Agent evidence from a legacy YAML Case timeline
    flow:
      - aiAssert: The Test Report overview includes the web Project and generate-report.yaml.
      - aiTap: Expand file generate-report.yaml
      - aiTap: the login to sauce demo Case
      - aiAssert: The Case has execution steps and a screenshot timeline.
      - aiTap: a screenshot in the Case timeline above the execution steps
      - aiAssert: The corresponding aiAct Step is selected and its Record evidence is available.
