target:
  serve: ./dist
  url: demo-midscene-test.html
  viewportWidth: 1440
  viewportHeight: 1200
tasks:
  - name: batch health and compact project tree
    flow:
      - aiAssert: The overview shows 2 of 2 cases passed, a 100% final pass rate, a 50% first-pass rate, one case passed after retry, and an 8 second Runner time. Compact is selected. The Web regression project is collapsed.
      - aiTap: the expand chevron to the left of Web regression
      - aiAssert: Checkout with retry and Verify cart summary appear as compact connected child rows under Web regression. Case names and status tags are readable and there are no separate Inspect buttons in these rows.
      - aiTap: the status filter showing All statuses
      - aiTap: the Needs attention option
      - aiAssert: Only Checkout with retry remains under Web regression; Verify cart summary is filtered out.
      - aiTap: the status filter showing Needs attention
      - aiTap: the All statuses option
      - aiTap: the Detailed view button
      - aiAssert: Both cases are visible. Detailed rows show their source file, attempt count and duration. Checkout with retry has a numbered screenshot timeline on the right, while Verify cart summary has no screenshot evidence.
      - aiHover: a screenshot thumbnail in the Checkout with retry timeline
      - aiAssert: An enlarged screenshot preview is visible near the hovered thumbnail.
      - aiTap: the Compact view button
      - aiAssert: Case rows are compact again and screenshot timelines are hidden.

  - name: project workspace and browser history
    flow:
      - aiTap: the Details action on the Web regression project row
      - aiAssert: The Web regression project page shows health metrics and a Cases section containing Checkout with retry and Verify cart summary, with search and status filters.
      - javascript: |
          const params = new URLSearchParams(location.hash.slice(1));
          if (params.get('runner-page') !== 'project') throw new Error('Missing project route');
          history.back();
        name: browserBackFromProject
      - aiAssert: The Overview is restored, with the Projects and cases section visible.
      - javascript: history.forward()
        name: browserForwardToProject
      - aiAssert: Browser Forward restores the Web regression project page and its Cases section.
      - aiTap: the Overview back link

  - name: retry attempts and custom node errors
    flow:
      - aiTap: the Checkout with retry case row
      - aiAssert: The case opens at the failed order.create step in Attempt 1, showing Inventory was not ready.
      - aiTap: the Attempt 2 selector
      - aiAssert: The case detail opens on Attempt 2. The visual timeline is above Execution and the evidence panel; aiAct is selected and an Inspect AI trace action is available.
      - aiHover: a screenshot in the full width Visual timeline
      - aiAssert: A screenshot preview is displayed while aiAct remains the selected execution step.
      - aiTap: the Attempt 1 selector
      - aiAssert: Attempt 1 is selected. The selected order.create step shows NODE_EXECUTION_ERROR and Inventory was not ready. Input & output includes the redacted apiKey. This custom step offers no AI trace action.

  - name: AI trace and namespaced deep link
    flow:
      - aiTap: the Attempt 2 selector
      - aiAssert: aiAct is selected again, with Input & output and Events tabs and actions to Inspect AI trace and Open AI trace in new tab.
      - javascript: |
          const link = document.querySelector('.runner-detail-trace-new-page');
          if (!(link instanceof HTMLAnchorElement)) throw new Error('Missing trace link');
          const params = new URLSearchParams(new URL(link.href).hash.slice(1));
          if (link.target !== '_blank' || params.get('runner-trace') !== 'page' || params.get('runner-step') !== 'attempt-2:steps:0') {
            throw new Error('Trace link lost its namespaced step context');
          }
        name: assertTraceDeepLink
      - aiTap: the Inspect AI trace button
      - aiAssert: A wide AI trace drawer is open with the recorded Agent task list and screenshot replay. The Case workspace remains behind it rather than being pushed down the page.
