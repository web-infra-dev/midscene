target:
  serve: ./dist
  url: demo-midscene-test.html
  viewportWidth: 1440
  viewportHeight: 1200
  # Keep screenshot coordinates consistent on Retina and CI machines.
  deviceScaleFactor: 1
tasks:
  - name: batch health and compact project tree
    flow:
      - aiAssert: The overview shows 2 of 2 cases passed, a 100% final pass rate, a 50% first-pass rate, one case passed after retry, and an 8 second Run time. Compact is selected. The Web regression project is collapsed.
      - aiTap: the 8 second duration cell at the right of the Web regression project row
      - aiAssert: Checkout with retry and Verify cart summary appear as compact indented child rows under Web regression. Each case name has an aligned status dot, with no duplicate metric columns or separate Inspect buttons in these rows.
      - aiTap: the status filter showing All statuses
      - aiTap: the Needs attention option
      - aiAssert: Only Checkout with retry remains under Web regression; Verify cart summary is filtered out.
      - aiTap: the status filter showing Needs attention
      - aiTap: the All statuses option
      - aiTap: the Detailed view button
      - aiAssert: Both cases are visible. Detailed rows show their source file, attempt count and duration. Checkout with retry has a numbered screenshot timeline below its details, while Verify cart summary has no screenshot evidence.
      - aiHover: a screenshot thumbnail in the Checkout with retry timeline
      - aiAssert: An enlarged screenshot preview is visible near the hovered thumbnail.
      - aiHover: the Projects and cases heading on the left, outside the screenshot timeline and its floating preview
      - aiTap: the Compact view button
      - aiAssert: Compact is selected. Case rows show their names and status dots without screenshot timelines.
      - aiTap: the Collapse all projects icon button to the right of Search projects, cases, and details
      - aiAssert: Web regression is collapsed and its child case rows are hidden.
      - aiTap: the Expand all projects icon button to the right of Search projects, cases, and details
      - aiAssert: Web regression is expanded and both case rows are visible.

  - name: direct case navigation and browser history
    flow:
      - aiTap: the Verify cart summary case row under Web regression
      - aiAssert: The Verify cart summary case detail has an Overview back link and an Execution panel with cart.verify selected. There is no Attempt selector for this single attempt.
      # Check history navigation through the route, then assert only visible UI with AI.
      - javascript: |
          new Promise((resolve, reject) => {
            const params = new URLSearchParams(location.hash.slice(1));
            if (params.get('runner-page') !== 'case' || params.get('runner-case') !== 'web-demo:checkout-document:first-pass-case') throw new Error('Missing Verify cart summary case route');
            const timeout = setTimeout(() => {
              window.removeEventListener('hashchange', onRouteChange);
              reject(new Error('Browser Back did not navigate to the overview'));
            }, 5000);
            function onRouteChange() {
              clearTimeout(timeout);
              const page = new URLSearchParams(location.hash.slice(1)).get('runner-page');
              if (page && page !== 'overview') reject(new Error(`Expected overview route, got ${location.hash}`));
              else resolve();
            }
            window.addEventListener('hashchange', onRouteChange, { once: true });
            history.back();
          });
        name: browserBackFromCase
      - aiAssert: The overview shows the Projects and cases heading and the Compact and Detailed view controls.
      - javascript: |
          new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
              window.removeEventListener('hashchange', onRouteChange);
              reject(new Error('Browser Forward did not navigate to the case'));
            }, 5000);
            function onRouteChange() {
              clearTimeout(timeout);
              const params = new URLSearchParams(location.hash.slice(1));
              if (params.get('runner-page') !== 'case' || params.get('runner-case') !== 'web-demo:checkout-document:first-pass-case') {
                reject(new Error(`Expected Verify cart summary case route, got ${location.hash}`));
              } else resolve();
            }
            window.addEventListener('hashchange', onRouteChange, { once: true });
            history.forward();
          });
        name: browserForwardToCase
      - aiAssert: The Verify cart summary case detail has an Overview back link, a Passed status, and an Execution panel showing cart.verify.
      - aiTap: the Overview back link

  - name: retry attempts and custom node errors
    flow:
      - aiTap: the Checkout with retry case row
      - aiAssert: The Checkout with retry case detail opens at the failed Step on Attempt 1, with order.create selected in the Execution panel.
      - javascript: |
          const evidence = document.querySelector('.runner-detail-evidence-panel');
          if (!(evidence instanceof HTMLElement)) throw new Error('Missing order.create evidence panel');
          evidence.scrollIntoView({ block: 'start' });
        name: revealOrderCreateEvidence
      - aiAssert: The order.create evidence panel shows NODE_EXECUTION_ERROR and Inventory was not ready. Input & output is selected, and its Input row shows sku demo-item with a redacted apiKey value.
      - javascript: |
          const main = document.querySelector('.runner-main');
          if (!(main instanceof HTMLElement)) throw new Error('Missing report scroll container');
          main.scrollTo({ top: 0 });
        name: restoreAttemptSelector
      - aiTap: the Attempts dropdown showing Attempt 1 above Execution
      - aiAssert: The dropdown shows Attempt 1 as Failed and Attempt 2 as Passed.
      - aiTap: the passed Attempt 2 option in the open Attempts dropdown, not the failed Attempt 1 option
      - sleep: 500
      - aiAssert: Attempt 2 is selected. The screenshot timeline appears above the horizontal execution groups, aiAct is selected, and Record contains the recorded Agent task list and replay player.
      - aiHover: a screenshot thumbnail in the timeline at the top of Execution
      - aiAssert: A screenshot preview is displayed and aiAct is the selected execution step.
      - aiHover: the Checkout with retry case title at the top left, outside the Execution timeline and its floating preview
      - aiTap: the Overview back link

  - name: embedded Agent report and evidence tabs
    flow:
      - aiTap: the Checkout with retry case row under Web regression
      - aiAssert: The case opens at the failed Step on Attempt 1, with order.create selected.
      - aiTap: the Attempts dropdown showing Attempt 1 above Execution
      - aiTap: the passed Attempt 2 option in the open Attempts dropdown, not the failed Attempt 1 option
      - sleep: 500
      - aiAssert: Attempt 2 and aiAct are selected, with Record, Input & output, and Events tabs, and an embedded Agent report.
      - aiTap: the Input & output tab
      - aiAssert: Input and Output appear as two stacked rows in one bordered panel. The execution groups remain visible above it.
      - aiTap: the Record tab
      - aiAssert: The recorded Agent task list and screenshot replay are visible within the Case workspace below Execution.
