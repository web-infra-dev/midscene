target:
  serve: ./dist
  url: demo-midscene-test.html
  viewportWidth: 1440
  viewportHeight: 1200
  # Keep screenshot coordinates consistent on Retina and CI machines.
  deviceScaleFactor: 1
tasks:
  - name: batch health and Project File Case hierarchy
    flow:
      - aiAssert: The overview shows 2 of 2 cases passed, one Retried case, one File and an 8 second total time. Compact is selected. Web regression has its own table and checkout.yaml is expanded, showing Checkout with retry and Verify cart summary.
      - aiTap: the Retried status checkbox near All, Failed and Passed
      - aiAssert: Only Checkout with retry remains under checkout.yaml. The file still shows 2 of 2 passed without an extra percentage.
      - aiTap: the checked Retried status checkbox
      - aiAssert: All is checked again and both cases are visible under checkout.yaml.
      - aiTap: the Passed status checkbox
      - aiAssert: Verify cart summary is visible and Checkout with retry is filtered out.
      - aiTap: the Retried status checkbox
      - aiAssert: Passed and Retried are checked together, All is unchecked, and both cases are visible.
      - aiTap: the All status checkbox
      - aiTap: the Duration column header in the Web regression table
      - aiAssert: Duration has an active descending sort arrow. There is no sorting dropdown.
      - aiTap: the File column header
      - aiAssert: File has an ascending arrow after switching from Duration. Checkout with retry still appears before Verify cart summary within its file.
      - aiTap: the Detailed view button
      - aiAssert: Both cases are visible with their status and duration. A screenshot timeline appears below Checkout with retry, while Verify cart summary has no screenshot evidence. checkout.yaml is shown as their parent file, not repeated in each Case row.
      - aiHover: a screenshot thumbnail in the Checkout with retry timeline
      - aiAssert: An enlarged screenshot preview is visible near the hovered thumbnail.
      - aiHover: the Compact view control at the top left, outside the screenshot timeline and its floating preview
      - aiTap: the Compact view button
      - aiAssert: Compact is selected. Both case rows are visible without screenshot timelines.
      - aiTap: the Collapse file checkout.yaml button
      - aiAssert: checkout.yaml remains visible with its aggregate statistics, but its child Case rows are hidden.
      - aiTap: the Expand file checkout.yaml button
      - aiTap: the Collapse project Web regression button
      - aiAssert: The Web regression heading remains visible, but its file table is hidden.
      - aiTap: the Expand project Web regression button
      - aiAssert: checkout.yaml and its two Case rows are visible again.

  - name: direct case navigation and browser history
    flow:
      - aiTap: the Verify cart summary case row under Web regression
      - aiAssert: The Verify cart summary case detail has an Overview back link and an Execution panel with cart.verify selected. There is no Attempt selector for this single attempt.
      # Check history navigation through the route, then assert only visible UI with AI.
      - javascript: |
          new Promise((resolve, reject) => {
            const params = new URLSearchParams(location.hash.slice(1));
            if (params.get('runner-page') !== 'case' || params.get('runner-case') !== 'web-demo:checkout-document:first-pass-case') throw new Error('Missing Verify cart summary case route');
            const timeout = setTimeout(() => {
              window.removeEventListener('hashchange', onRouteChange);
              reject(new Error('Browser Back did not navigate to the overview'));
            }, 5000);
            function onRouteChange() {
              clearTimeout(timeout);
              const page = new URLSearchParams(location.hash.slice(1)).get('runner-page');
              if (page && page !== 'overview') reject(new Error(`Expected overview route, got ${location.hash}`));
              else resolve();
            }
            window.addEventListener('hashchange', onRouteChange, { once: true });
            history.back();
          });
        name: browserBackFromCase
      - aiAssert: The overview shows the Web regression project and the Compact and Detailed view controls.
      - javascript: |
          new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
              window.removeEventListener('hashchange', onRouteChange);
              reject(new Error('Browser Forward did not navigate to the case'));
            }, 5000);
            function onRouteChange() {
              clearTimeout(timeout);
              const params = new URLSearchParams(location.hash.slice(1));
              if (params.get('runner-page') !== 'case' || params.get('runner-case') !== 'web-demo:checkout-document:first-pass-case') {
                reject(new Error(`Expected Verify cart summary case route, got ${location.hash}`));
              } else resolve();
            }
            window.addEventListener('hashchange', onRouteChange, { once: true });
            history.forward();
          });
        name: browserForwardToCase
      - aiAssert: The Verify cart summary case detail has an Overview back link, a Passed status, and an Execution panel showing cart.verify.
      - aiTap: the Overview back link

  - name: retry attempts and custom node errors
    flow:
      - aiTap: the Checkout with retry case row
      - aiAssert: The Checkout with retry case detail opens at the failed Step on Attempt 1, with order.create selected in the Execution panel.
      - aiAssert: The selected order.create step and its Step failed card are visible without manual scrolling. The card shows Inventory was not ready with collapsed details. Information is selected, and Input shows sku demo-item with a redacted apiKey value.
      - aiTap: the collapsed details control inside the Step failed error card
      - aiAssert: The expanded error card details show NODE_EXECUTION_ERROR.
      - javascript: |
          const main = document.querySelector('.runner-main');
          if (!(main instanceof HTMLElement)) throw new Error('Missing report scroll container');
          main.scrollTo({ top: 0 });
        name: restoreAttemptSelector
      - aiAssert: The Execution header groups the Visual and YAML switch with the Attempts dropdown on the left, and the Total steps, Success, Failed, Timeout, and Not run counts on the right.
      - aiTap: the Attempts dropdown showing Attempt 1 beside Visual and YAML in the Execution header
      - aiAssert: The dropdown shows Attempt 1 as Failed and Attempt 2 as Passed.
      - aiTap: the passed Attempt 2 option in the open Attempts dropdown, not the failed Attempt 1 option
      - sleep: 500
      - aiAssert: Attempt 2 is selected. The screenshot timeline appears above the workspace. Execution steps are listed on the left, aiAct is selected, and Record contains the recorded Agent task list and screenshot viewer on the right.
      - aiHover: a screenshot thumbnail in the timeline at the top of Execution
      - aiAssert: A screenshot preview is displayed and aiAct is the selected execution step.
      - aiHover: the Checkout with retry case title at the top left, outside the Execution timeline and its floating preview
      - aiTap: the Overview back link

  - name: embedded Agent report and evidence tabs
    flow:
      - aiTap: the Checkout with retry case row under Web regression
      - aiAssert: The case opens at the failed Step on Attempt 1, with order.create selected.
      - aiTap: the Attempts dropdown showing Attempt 1 beside Visual and YAML in the Execution header
      - aiTap: the passed Attempt 2 option in the open Attempts dropdown, not the failed Attempt 1 option
      - sleep: 500
      - aiAssert: Attempt 2 and aiAct are selected, with Record, Information, and Events tabs, and an embedded Agent report.
      - aiTap: the Information tab
      - aiAssert: Input, Output, and Stable IDs appear as aligned rows in one white bordered panel extending to the bottom of the detail area. The timeline, execution steps pane, and outer detail area share the same pale background. Document setup, Before each, Case steps, and After each are separated by dividers. Step rows have no leading type icons or individual white bordered cards.
      - aiTap: the Events tab
      - aiAssert: Events is selected. Runtime events appear in a white panel extending to the bottom of the detail area, with Time, Operation, Event, and Status columns. The operation is labeled Run step. Started and Finished events are visible, with a success status for Finished. The execution step list remains visible on the left.
      - aiTap: the Record tab
      - aiAssert: The recorded Agent task list and screenshot viewer are visible on the right of the Case workspace. Both panes and the narrow resize strip between them have the same white background, with no pale gray band around the divider.

  - name: execution divider preserves the recording at maximum sidebar width
    flow:
      # Keyboard sizing tests the divider's bounds deterministically; keep the
      # resulting player visibility check on AI.
      - javascript: |
          (async () => {
            const divider = document.querySelector('[aria-label="Resize execution steps"]');
            if (!(divider instanceof HTMLElement)) throw new Error('Missing execution divider');
            const initial = Number(divider.getAttribute('aria-valuenow'));
            divider.dataset.initialWidth = String(initial);
            divider.focus();
            divider.dispatchEvent(new KeyboardEvent('keydown', { key: 'End', bubbles: true }));
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            const value = Number(divider.getAttribute('aria-valuenow'));
            const maximum = Number(divider.getAttribute('aria-valuemax'));
            const pane = document.querySelector('.runner-detail-step-scroll');
            if (!(pane instanceof HTMLElement)) throw new Error('Missing execution steps pane');
            if (!Number.isFinite(maximum) || Math.abs(value - maximum) > 0.5 || value <= initial) {
              throw new Error('Execution sidebar did not grow to its maximum');
            }
            if (Math.abs(pane.getBoundingClientRect().width - maximum) > 1) {
              throw new Error('Execution steps pane does not match the maximum width');
            }
          })();
        name: maximizeExecutionSidebar
      - aiAssert: The aiAct step is selected in the left execution steps pane. To its right, the Record tab is selected, and both the recorded Agent task list and screenshot viewer are visible side by side.
      - javascript: |
          (async () => {
            const divider = document.querySelector('[aria-label="Resize execution steps"]');
            if (!(divider instanceof HTMLElement)) throw new Error('Missing execution divider');
            divider.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            const value = Number(divider.getAttribute('aria-valuenow'));
            const initial = Number(divider.dataset.initialWidth);
            if (!Number.isFinite(initial) || value !== initial) throw new Error('Divider did not reset to its initial width');
            delete divider.dataset.initialWidth;
          })();
        name: resetExecutionSidebar
      - aiAssert: The aiAct step remains selected in the left execution steps pane. To its right, both the recorded Agent task list and screenshot viewer remain visible side by side in the Record tab.

  - name: runner events remain readable in both themes
    flow:
      - aiTap: the Events tab in the selected aiAct details
      - aiTap: the theme toggle button in the top right header
      - aiAssert: The Test Report is in dark theme. The Execution steps and Events table use dark surfaces with readable text, and the Finished event has a green success badge.
      - aiTap: the theme toggle button in the top right header
      - aiAssert: The Test Report is back in light theme. The same aiAct step and Events tab remain selected, and the event table is readable.
