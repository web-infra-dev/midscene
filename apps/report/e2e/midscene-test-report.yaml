# Keep these checks in one Case: later sections use the page state left by earlier ones.
beforeAll:
  - report.open:
      path: demo-midscene-test.html
      viewportWidth: 1440
      viewportHeight: 1200
      deviceScaleFactor: 1

cases:
  - name: Test report filters, navigation, retries, tokens and evidence
    steps:
      # filter Cases and inspect detailed evidence
      - aiAssert: The overview shows 2 of 2 Cases passed. Checkout with retry and Verify cart summary are both Passed; Checkout with retry has a warning about an earlier failure.
      - aiTap: the Passed status checkbox
      - aiAssert: Both Cases remain visible under Passed, and checkout.yaml retains its 2 of 2 passed result.
      - aiTap: the Failed status checkbox
      - aiAssert: Both Cases remain visible with Passed and Failed selected.
      - aiTap: the Passed status checkbox
      - aiAssert: No files or cases match these filters, because no Case finally failed.
      - aiTap: Clear filters in the empty results
      - aiAssert: All is selected and both Cases are visible.
      - aiTap: Detailed
      - aiAssert: Checkout with retry has screenshot evidence and an Earlier attempt error summary containing Inventory was not ready.
      - aiHover: a screenshot in the Checkout with retry timeline
      - aiAssert: A screenshot preview is visible.
      - aiHover: Compact, outside the timeline preview
      - aiTap: the Earlier attempt error summary for Checkout with retry
      - aiAssert: The Case opens on the failed order.create Step in Attempt 1, showing Inventory was not ready.
      - aiTap: the Overview back link
      - wait:
          duration: 500
          unit: ms
      - aiTap: the Compact view button
      - aiAssert: Compact is selected and both Case rows are visible without their detailed evidence.

      # browser history navigates between overview and Case
      - aiTap: the Verify cart summary Case
      - aiAssert: Verify cart summary is open with cart.verify selected and Tokens 0. No retry attempt can be selected.
      # Browser history is a route integration check; keep visible results on AI.
      # browserBackFromCase
      - javascript:
          script: |
            new Promise((resolve, reject) => {
              const timeout = setTimeout(() => reject(new Error('Back navigation timed out')), 5000);
              window.addEventListener('hashchange', () => { clearTimeout(timeout); resolve(); }, { once: true });
              history.back();
            });
      - aiAssert: The overview shows Web regression and its Case rows.
      # browserForwardToCase
      - javascript:
          script: |
            new Promise((resolve, reject) => {
              const timeout = setTimeout(() => reject(new Error('Forward navigation timed out')), 5000);
              window.addEventListener('hashchange', () => { clearTimeout(timeout); resolve(); }, { once: true });
              history.forward();
            });
      - aiAssert: Verify cart summary is open again with cart.verify selected.
      - aiTap: the Overview back link

      # inspect retry errors and cumulative Case token usage
      - aiTap: the Checkout with retry Case
      - aiAssert: The Case is Passed with a warning about an earlier failure. Attempt 2 is selected and aiAct succeeded with a recorded execution.
      - aiTap: the Attempt 2 selector
      - aiTap: Attempt 1 in the open attempt menu
      - aiAssert: Attempt 1 is selected. order.create failed with Inventory was not ready, and the Case has a nonzero Tokens total. Information shows input sku demo-item and a redacted apiKey.
      - aiHover: the Tokens total in the Case header
      - aiAssert: A model usage tooltip shows model calls and input, cached input, output, and total tokens.
      - aiHover: the Case title
      # captureCumulativeCaseTokens
      - javascript:
          script: |
            (() => {
              const tokens = document.querySelector('[aria-label="Case model token usage"] strong')?.textContent;
              const total = Number(tokens?.replaceAll(',', ''));
              if (!Number.isFinite(total) || total <= 0) throw new Error('Expected cumulative Case tokens');
              window.caseTokensBeforeRetrySwitch = tokens;
            })();
      - aiTap:
          prompt: the collapsed details control in the Step failed card
          options:
            deepLocate: true
      - aiAssert: The error details include NODE_EXECUTION_ERROR.
      - aiTap: the Attempt 1 selector
      - aiTap: Attempt 2 in the open attempt menu
      - aiAssert: Attempt 2 succeeded. aiAct is selected and its recorded Agent execution is available.
      # cumulativeCaseTokensSurviveAttemptSwitch
      - javascript:
          script: |
            (() => {
              const tokens = document.querySelector('[aria-label="Case model token usage"] strong')?.textContent;
              if (tokens !== window.caseTokensBeforeRetrySwitch) throw new Error('Case tokens must include all attempts and remain unchanged when switching');
              delete window.caseTokensBeforeRetrySwitch;
            })();

      # inspect recorded evidence information and events
      # Closing the attempt menu can leave the pointer over a timeline preview.
      - aiHover: the Checkout with retry Case title, outside screenshot timelines
      - aiTap:
          prompt: the Information tab between Record and Events in the selected aiAct Step's inspector, above the embedded Agent recording
          options:
            deepLocate: true
      - aiAssert: The selected Step's Information shows Input, Output and Stable IDs.
      - aiTap: the Events tab beside Information in the selected Step's inspector
      - aiAssert: Runtime events include Started and Finished, with success reported for the finished operation.
      - aiTap: the Record tab beside Information in the selected Step's inspector
      - aiAssert: The recorded Agent task list and screenshot viewer are available.
