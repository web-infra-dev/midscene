target:
  serve: ./dist
  url: demo-midscene-test-lifecycle.html
  viewportWidth: 1440
  viewportHeight: 1200
  deviceScaleFactor: 1
tasks:
  - name: inspect setup and cleanup failures
    flow:
      - aiAssert: The run failed. Project browser disposal failed is reported, and the Cases include Verify cart summary and the not-run Blocked by document setup.
      - aiTap: the Blocked by document setup Case
      - aiAssert: The Case did not run. The failed fixture.connect setup Step shows Database connection refused and input host fixture-database. No retry attempt can be selected.
      - aiTap: the Overview back link
      - aiTap: the Verify cart summary Case
      - aiAssert: The cart.verify Step succeeded, while cleanup errors are reported separately. A View all 2 issues action is available.
      - aiTap: View all 2 issues
      - aiAssert: The issues drawer shows Document fixture disposal failed and Case session disposal failed.
      - aiTap: the close button in the Other issues drawer
      - aiAssert: The drawer is closed and cart.verify remains selected.
