target:
  serve: ./dist
  url: demo-midscene-test-lifecycle.html
  viewportWidth: 1440
  viewportHeight: 1200
  # Keep screenshot coordinates consistent on Retina and CI machines.
  deviceScaleFactor: 1
tasks:
  - name: lifecycle failures remain visible outside case attempts
    flow:
      - aiAssert: The overview reports a failed run and shows Project browser disposal failed. Web regression is expanded and includes the failed Verify cart summary case and the not-run Blocked by document setup case.
      - aiTap: the Blocked by document setup case row
      - aiAssert: The not-run case has no Attempt selector. Its Execution panel shows the failed fixture.connect step under Document setup, and the evidence panel shows Database connection refused.
      - aiAssert: The visible Information panel for fixture.connect shows Input with host fixture-database.
      - javascript: |
          const main = document.querySelector('.runner-main');
          if (!(main instanceof HTMLElement)) throw new Error('Missing report scroll container');
          main.scrollTo({ top: 0 });
        name: restoreCaseHeader
      - aiTap: the Overview back link
      - aiAssert: The overview shows Web regression and the Project browser disposal failed error card.
      - aiTap: the Verify cart summary case row under Web regression
      - aiAssert: The Verify cart summary case detail has an Execution panel with a green success indicator on cart.verify, an Information tab, and no Record tab or Attempt selector. A cleanup error card and a View all 2 issues control appear above Execution.
      - aiTap: the View all 2 issues control above Execution
      - aiAssert: The Other issues drawer contains separate error cards for Document fixture disposal failed and Case session disposal failed, both with details collapsed.
      - aiTap: the close button in the top right of the Other issues drawer
      - aiAssert: The drawer is closed and the cart.verify step is still selected.
