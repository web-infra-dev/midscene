target:
  serve: ./dist
  url: demo-agent.html
tasks:
  - name: inspect screenshots and JSON for an Agent task
    flow:
      - aiTap: a Plan task in the left task list
      - aiTap: Screenshots in the task detail view switch
      - aiAssert: Screenshots is selected and the task's screenshot evidence is visible.
      - aiTap: JSON View in the task detail view switch
      - aiAssert: JSON View is selected and structured task data is visible.

  - name: inspect task information
    flow:
      - aiAssert: The selected task's information shows Param and Output or Element data.
      - aiTap: the Param section heading in the task information
      - aiAssert: Param is collapsed and the other information sections remain available.

  - name: Playground entry is available for a Plan task
    flow:
      - aiAssert: An Open in Playground action is available for the selected Plan task.
