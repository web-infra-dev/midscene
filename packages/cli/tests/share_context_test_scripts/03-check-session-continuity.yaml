# Third YAML file - Verifies browser-context sharing and page-state isolation
web:
  url: ${SHARED_BROWSER_TEST_ORIGIN}/share-context-test.html
  viewportWidth: 800
  viewportHeight: 600

tasks:
  - name: Check serial page state is isolated
    flow:
      - javascript: |
          (function() {
            const cookies = readCookies();
            const sessionId = sessionStorage.getItem('sessionId');
            if (sessionId !== null) {
              throw new Error(`Previous YAML sessionStorage leaked! Expected null, got "${sessionId}"`);
            }
            if (window.name !== '') {
              throw new Error(`Previous YAML window.name leaked! Expected an empty string, got "${window.name}"`);
            }
            if (cookies.authToken !== 'test-token-123') {
              throw new Error(`Setup cookie was not shared: ${document.cookie}`);
            }
            if (localStorage.getItem('userId') !== 'user-456') {
              throw new Error('Setup localStorage was not shared');
            }
            return {
              sessionId,
              windowName: window.name,
              userId: localStorage.getItem('userId')
            };
          })()
        name: check_serial_page_isolation
