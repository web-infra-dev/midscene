<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Trail Store</title>
  <style>
    body { font: 20px sans-serif; margin: 40px; color: #172a3a; background: #f4f7fa; }
    main { display: flex; gap: 24px; }
    article { background: white; padding: 20px; width: 240px; border: 1px solid #cad4df; }
    img { width: 120px; height: 120px; }
    h2 { font-size: 22px; }
    button { font: inherit; padding: 10px; }
  </style>
</head>
<body>
  <h1>Trail Store</h1>
  <main>
    <article><img src="/products/backpack.svg" alt="Trail Backpack" /><h2>Trail Backpack</h2><p>$29.99</p><button>Add to cart</button></article>
    <article><img src="/products/light.svg" alt="Camp Light" /><h2>Camp Light</h2><p>$9.99</p><button>Add to cart</button></article>
    <article><img src="/products/jacket.svg" alt="Trail Jacket" /><h2>Trail Jacket</h2><p>$49.99</p><button>Add to cart</button></article>
  </main>
</body>
</html>
