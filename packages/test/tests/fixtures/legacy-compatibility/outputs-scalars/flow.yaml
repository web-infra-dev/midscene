interface:
  module: ${COMPAT_DEVICE}
  param:
    root: ${COMPAT_ROOT}
    log: ${COMPAT_LOG}
agent:
  generateReport: false
  autoPrintReportMsg: false
config:
  output: ${COMPAT_ROOT}/output.json
tasks:
  - name: first
    flow:
      - javascript: "0"
        name: zero
      - javascript: "false"
        name: flag
      - javascript: "null"
        name: nil
      - javascript: "''"
        name: empty
      - javascript: "undefined"
      - javascript: "7"
  - name: second
    flow:
      - javascript: "8"
        name: zero
      - javascript: "9"
        name: ""
