interface:
  module: ${COMPAT_DEVICE}
  param:
    root: ${COMPAT_ROOT}
    log: ${COMPAT_LOG}
agent:
  generateReport: false
  autoPrintReportMsg: false
config:
  output: ${COMPAT_ROOT}/output.json
tasks:
  - name: failing task
    continueOnError: true
    flow:
      - javascript: "record('start'); failOnce('action'); record('after-step')"
  - name: following task
    flow:
      - javascript: "record('next-task')"
