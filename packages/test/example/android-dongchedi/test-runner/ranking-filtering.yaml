# 本文件是 Case 生成 Agent 的 YAML 产物示例。
# 生成输入：产品要求与 midscene-nodes.md；页面跳转和组件 Context 在运行时消费。

beforeEach:
  - launch:
      uri: ${appUri}
  - aiAct:
      prompt: 重置排行榜页面状态。
      $:
        timeout: 180000
  - aiAssert:
      prompt: 当前位于排行榜页面。
      message: 排行榜初始状态恢复失败

cases:
  - name: 销量榜轿车燃油车组合筛选
    tags: [ranking-filter, preset-price]
    steps:
      - aiAct:
          prompt: 切换到“销量榜”，将车型设为“轿车”，榜单时间设为“上个月月份”，能源类型设为“燃油车”，再从页面提供的常用价位中选择一个非默认价位。不要使用自定义价格；如果所选价位没有结果，就改选另一个非默认常用价位，直到结果列表正常展示。完成后停留在能确认筛选回显和结果列表的页面。
          $:
            timeout: 300000
      - aiAssert:
          prompt: 当前位于“销量榜”；车型“轿车”、榜单时间“上个月月份”、能源类型“燃油车”和一个非默认常用价位均清楚显示为已选中或已回显；同一筛选类别没有同时选中多个互斥选项；结果列表已正常加载，并且至少有一项可查看的车型结果。
          message: 销量榜轿车燃油车组合筛选未正确生效
          options:
            context: ${rankingTimeContext}

  - name: 销量榜 SUV 插电式混动筛选
    tags: [ranking-filter]
    steps:
      - aiAct:
          prompt: 切换到“销量榜”，将车型筛选设为“SUV”，将能源类型筛选设为“插电式混动”。不要设置其他非默认筛选条件，完成后停留在能确认筛选状态和榜单结果的位置。
          $:
            timeout: 240000
      - aiAssert:
          prompt: 当前位于“销量榜”；车型“SUV”和能源类型“插电式混动”均清楚显示为已选中或已回显，并且各自类别中没有同时选中其他互斥选项；榜单结果已正常加载，并且至少有一项可查看的车型结果。
          message: 销量榜 SUV 插电式混动筛选未正确生效

  - name: 新能源榜近半年纯电 SUV 筛选
    tags: [ranking-filter, preset-price]
    steps:
      - aiAct:
          prompt: 切换到“新能源榜”，将车型设为“SUV”，榜单时间设为“近半年”，能源类型设为“纯电动”，再从页面提供的常用价位中选择一个非默认价位。不要使用自定义价格；如果所选价位没有结果，就改选另一个非默认常用价位，直到结果列表正常展示。完成后停留在能确认筛选回显和结果列表的页面。
          $:
            timeout: 300000
      - aiAssert:
          prompt: 当前位于“新能源榜”；车型“SUV”、榜单时间“近半年”、能源类型“纯电动”和一个非默认常用价位均清楚显示为已选中或已回显；同一筛选类别没有同时选中多个互斥选项；结果列表已正常加载，并且至少有一项可查看的车型结果。
          message: 新能源榜近半年纯电 SUV 筛选未正确生效

  - name: 降价榜新能源 MPV 自定义价格筛选
    tags: [ranking-filter, custom-price]
    steps:
      - aiAct:
          prompt: 切换到“降价榜”，将车型设为“MPV”，上市时间设为“近一年”，能源类型设为“新能源”。打开价格的自定义范围，将最低价精确设为 10 万元、最高价精确设为 40 万元，并确认应用该范围。完成后停留在能确认筛选回显和结果列表的页面，不要进入车型详情。
          $:
            timeout: 360000
      - aiAssert:
          prompt: 当前位于“降价榜”；车型“MPV”、上市时间“近一年”和能源类型“新能源”均清楚显示为已选中或已回显；价格筛选清楚回显最低 10 万元、最高 40 万元的自定义范围，而不是某个常用价位；同一筛选类别没有同时选中多个互斥选项；结果列表已正常加载，并且至少有一项可查看的车型结果。
          message: 降价榜新能源 MPV 自定义价格筛选未正确生效

  - name: 排行榜切换与重新筛选
    tags: [ranking-filter, state-reset]
    steps:
      - aiAct:
          prompt: 在“销量榜”设置多项非默认条件：车型选“轿车”、榜单时间选“近一年”、能源类型选“燃油车”，并选择一个页面提供的非默认常用价位。完成后停留在能确认这些筛选回显的位置。
          $:
            timeout: 300000
      - aiAssert:
          prompt: 当前位于“销量榜”；“轿车”、“近一年”、“燃油车”和一个非默认常用价位均清楚显示为已选中或已回显，结果列表已根据这些条件正常加载。
          message: 销量榜初始筛选组合未正确生效
      - aiAct:
          prompt: 切换到“新能源榜”。只执行榜单切换，不要手动逐项修改筛选；完成后停留在能确认筛选状态和结果列表的位置。
          $:
            timeout: 180000
      - aiAssert:
          prompt: 当前位于“新能源榜”；此前销量榜设置的“轿车”、“近一年”、“燃油车”和非默认常用价位均没有作为旧筛选条件错误保留，当前呈现新能源榜自身合理的默认筛选状态；结果列表已正常加载。
          message: 切换榜单后旧筛选条件仍被错误保留
      - aiAct:
          prompt: 保持在“新能源榜”，重新设置筛选：车型选“SUV”、榜单时间选“近半年”、能源类型选“纯电动”，并选择一个页面提供的非默认常用价位。完成后停留在能确认筛选回显和结果列表的位置。
          $:
            timeout: 300000
      - aiAssert:
          prompt: 当前仍位于“新能源榜”；“SUV”、“近半年”、“纯电动”和一个非默认常用价位均清楚显示为已选中或已回显，结果列表已根据新条件正常加载。
          message: 新能源榜的新筛选组合未正确生效
