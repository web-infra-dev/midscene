# Example config for the on-device agent (`midscene-local run`).
#
# Copy next to your scripts, edit, and run from the host with `backend: adb-shell`.
# On the phone the app injects the bridge runner and file I/O through the
# environment, so no backend/fileChannelDir is needed there (the app's generated
# config carries the channel directory).
#
# Secrets should come from the environment or a secret store in real
# deployments — see apps/android-host/README.md.

name: phone-smoke

device:
  # adb-shell = PC + USB cable (debugging, regression, CI).
  # On the phone the bridge is selected by the injected environment, not here.
  backend: adb-shell
  displayId: 0
  # yadb enables Chinese/emoji input and pinch gestures
  yadbPath: /data/local/tmp/yadb
  appNameMapping:
    Settings: com.android.settings
    WeChat: com.tencent.mm

agent:
  generateReport: true
  reportDir: ./midscene_run/agent-results
  screenshotShrinkFactor: 1

tasks:
  # A YAML script keeps the task data-driven and reviewable.
  - name: settings-search
    type: yaml
    script: ./scripts/settings-search.yaml

  # Inline prompt tasks are handy for smoke checks.
  - name: back-home
    type: aiAct
    prompt: go back to the home screen

  - name: home-visible
    type: aiAssert
    prompt: the home screen (launcher) is visible
