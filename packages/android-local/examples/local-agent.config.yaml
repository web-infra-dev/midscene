# Example config for the on-device agent (`midscene-local run`).
#
# Copy next to your scripts, edit, and run from the phone (Termux) or from the
# host with backend adb-shell. Secrets should come from the environment or a
# secret store in real deployments — see docs/deployment.md.

name: phone-smoke

device:
  # rish = on-device agent through Shizuku (phone only, no PC involved)
  # adb-shell = PC + USB cable (debugging, regression)
  backend: rish
  displayId: 0
  rishPath: /data/local/tmp/rish
  # yadb enables Chinese/emoji input and pinch gestures
  yadbPath: /data/local/tmp/yadb
  appNameMapping:
    设置: com.android.settings
    微信: com.tencent.mm

agent:
  generateReport: true
  reportDir: ./midscene_run/agent-results
  screenshotShrinkFactor: 1

tasks:
  # A YAML script keeps the task data-driven and reviewable.
  - name: settings-search
    type: yaml
    script: ./scripts/settings-search.yaml

  # Inline prompt tasks are handy for smoke checks.
  - name: back-home
    type: aiAct
    prompt: go back to the home screen

  - name: home-visible
    type: aiAssert
    prompt: the home screen (launcher) is visible
