# Midscene on-device self-check.
#
# Purpose: exercise the whole chain from a single run and make the cost of each kind
# of step comparable. Sections are named by kind so the per-task timings in the result
# JSON answer "what is slow" without guessing:
#
#   01/02  direct shell   - runAdbShell, no model call at all
#   03     tab tour      - one aiTap per console tab: five model round trips, which is
#                          what tapping a labelled element costs (there is no raw
#                          coordinate tap in the YAML dialect)
#   04     ui toggle      - aiTap locates a switch and flips it
#   05/06  perception     - aiAssert / aiQuery (one model round trip each)
#
# Direct actions dominate on purpose: they are deterministic, they cannot get stuck on
# a misread screen, and they isolate transport cost from model cost.
name: self-check
device:
  backend: rish
  rishPath: /data/local/tmp/rish
  yadbPath: /data/local/tmp/yadb
  fileChannelDir: /storage/emulated/0/Android/data/com.midscene.localagent/files/channel
agent:
  generateReport: true
  # The tour drives this app, so it must not be sent to the launcher first.
  resetToHome: false
  reportDir: ./midscene_run/results
tasks:
  - name: 01-direct-app-and-keys
    type: yaml
    script: |
      tasks:
        - name: direct-app-and-keys
          flow:
            - runAdbShell: "am start -n com.midscene.localagent/.ConsoleActivity"
            - sleep: 800
            - runAdbShell: "input keyevent KEYCODE_HOME"
            - sleep: 600
            - runAdbShell: "input keyevent KEYCODE_APP_SWITCH"
            - sleep: 600
            - runAdbShell: "input keyevent KEYCODE_BACK"
            - sleep: 400
            - runAdbShell: "dumpsys window | grep -m1 mCurrentFocus"
  - name: 02-direct-settings-scroll-shot
    type: yaml
    script: |
      tasks:
        - name: direct-settings-scroll-shot
          flow:
            - runAdbShell: "am start -a android.settings.SETTINGS"
            - sleep: 1500
            - runAdbShell: "input swipe 1280 1400 1280 700 250"
            - sleep: 800
            - runAdbShell: "input swipe 1280 1400 1280 700 250"
            - sleep: 800
            - runAdbShell: "screencap -p /data/local/tmp/selfcheck.png"
            - runAdbShell: "ls -l /data/local/tmp/selfcheck.png"
  - name: 03-ui-tab-tour
    type: yaml
    script: |
      tasks:
        - name: tap-every-tab
          flow:
            - runAdbShell: "am start -n com.midscene.localagent/.ConsoleActivity"
            - sleep: 1200
            - aiTap: "Scripts 标签（左侧导航栏或底部导航栏上的 Scripts）"
            - sleep: 400
            - aiTap: "History 标签"
            - sleep: 400
            - aiTap: "Diagnostics 标签"
            - sleep: 400
            - aiTap: "Settings 标签"
            - sleep: 400
            - aiTap: "Run 标签"
  - name: 04-ui-toggle-a-switch
    type: aiAct
    prompt: 打开 Midscene 应用，进入 Settings 页，把 AGENT OVERLAY 区域的第一个开关切换一次
  - name: 05-assert-screen
    type: aiAssert
    prompt: 屏幕上有可见内容，不是黑屏或空白
  - name: 06-query-screen
    type: aiQuery
    prompt: 用一句话描述当前屏幕上最重要的内容
