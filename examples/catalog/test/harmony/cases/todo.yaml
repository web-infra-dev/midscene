beforeEach:
  - todo.setup: {}
  - aiAssert:
      prompt: >-
        The React TodoMVC page shows the "What needs to be done?" input and no
        Todo items, including completed items. The list is unfiltered: All is
        selected whenever the filter controls are visible. No browser,
        permission, or other dialog covers the page.
      message: >-
        TodoMVC initial-state check failed. If tasks remain, select All and
        delete every task, including completed tasks, or clear this website's
        data. Close blocking dialogs and rerun. If the reported reason is a
        model or connection error, fix that error first.

cases:
  - name: Manage TodoMVC on HarmonyOS
    steps:
      - aiAct: Type "Study JS today" in the new Todo input and press Enter
      - aiAct: Type "Study Rust tomorrow" in the new Todo input and press Enter
      - aiAct: Type "Study AI the day after tomorrow" in the new Todo input and press Enter
      - aiAct: Delete the second Todo, "Study Rust tomorrow"
      - aiAct: Complete the second remaining Todo, "Study AI the day after tomorrow"
      - aiAct: Select the Completed filter below the Todo list
      - aiAssert: >-
          Only one Todo is visible under Completed: "Study AI the day after tomorrow".
          The footer says "1 item left".
