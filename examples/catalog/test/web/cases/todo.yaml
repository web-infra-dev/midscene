beforeAll:
  - setViewportSize:
      width: 1280
      height: 720

beforeEach:
  - todo.setup: {}
  - todo.seed:
      items:
        - Learn JS today
        - Learn Rust tomorrow
        - Learn AI the day after tomorrow

cases:
  - name: Seed TodoMVC with deterministic Nodes
    tags: [deterministic]
    steps:
      - todo.expectState:
          items:
            - title: Learn JS today
              completed: false
            - title: Learn Rust tomorrow
              completed: false
            - title: Learn AI the day after tomorrow
              completed: false

  - name: Manage TodoMVC with AI
    tags: [smoke, ai]
    steps:
      - aiAct:
          prompt: Delete the Todo named "Learn Rust tomorrow".
          $:
            timeout: 180000
      - aiAct:
          prompt: Mark the Todo named "Learn AI the day after tomorrow" as completed.
          $:
            timeout: 180000
      - aiAssert:
          prompt: >-
            The list displays exactly two Todo rows in total, counting both
            completed and incomplete rows. "Learn AI the day after tomorrow"
            has a checked checkbox and strikethrough text. "Learn JS today"
            has an unchecked checkbox. There is no row named "Learn Rust
            tomorrow". The footer indicates one incomplete item ("1 item
            left", with or without a trailing exclamation mark).
          message: TodoMVC does not show the expected final state.
          $:
            timeout: 180000
      - todo.expectState:
          items:
            - title: Learn JS today
              completed: false
            - title: Learn AI the day after tomorrow
              completed: true

afterEach:
  - todo.captureState: {}

afterAll:
  - recordToReport:
      title: TodoMVC Test Runner demo completed
      options:
        content: >-
          This workflow combines reusable deterministic Nodes with Midscene AI
          actions and assertions.
